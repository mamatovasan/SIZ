<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Проверка СИЗ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --bg:#EEF1EF;
    --surface:#FFFFFF;
    --ink:#14181C;
    --ink-soft:#5B6570;
    --line: rgba(20,24,28,0.16);
    --line-strong:#14181C;
    --accent:#DE5A1F;
    --accent-ink:#FFFFFF;
    --ok:#1F8A3B;
    --ok-bg:#E7F5EA;
    --warn:#B9790A;
    --warn-bg:#FBF0DA;
    --danger:#C4342B;
    --danger-bg:#FBE7E5;
    --none:#8A939B;
    --none-bg:#EEF0F1;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Archivo',sans-serif;
    font-weight:800;
    letter-spacing:-0.01em;
    margin:0;
  }
  #app{max-width:980px;margin:0 auto;padding:0 20px 80px;}
  .topbar{
    display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;
    padding:28px 0 18px;border-bottom:3px solid var(--line-strong);margin-bottom:28px;
  }
  .brand{display:flex;align-items:baseline;gap:12px;}
  .brand-mark{font-family:'Archivo',sans-serif;font-weight:800;font-size:28px;background:var(--accent);color:var(--accent-ink);padding:4px 10px;}
  .brand-sub{color:var(--ink-soft);font-size:14px;}
  .tabs{display:flex;gap:4px;background:var(--surface);border:2px solid var(--line-strong);}
  .tab{
    font-family:'Inter',sans-serif;font-weight:600;font-size:14px;color:var(--ink);
    background:transparent;border:none;padding:10px 16px;cursor:pointer;
  }
  .tab.active{background:var(--ink);color:#fff;}
  .tab:not(.active):hover{background:var(--bg);}
  .view{display:none;}
  .view.active{display:block;}

  .steps{display:flex;gap:0;margin-bottom:28px;border:2px solid var(--line-strong);}
  .step{flex:1;padding:12px 14px;border-right:2px solid var(--line-strong);}
  .step:last-child{border-right:none;}
  .step-num{font-family:'Archivo',sans-serif;font-weight:800;font-size:13px;color:var(--ink-soft);}
  .step.is-active{background:var(--ink);color:#fff;}
  .step.is-active .step-num{color:#fff;}
  .step.is-done{background:#fff;}
  .step-label{font-size:13px;font-weight:600;margin-top:2px;}

  .panel{background:var(--surface);border:2px solid var(--line-strong);padding:22px;}
  .panel + .panel{margin-top:18px;}

  .grid-buttons{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;}
  .pick-btn{
    text-align:left;font-family:'Inter',sans-serif;font-weight:600;font-size:15px;
    background:#fff;border:2px solid var(--line-strong);padding:16px;cursor:pointer;color:var(--ink);
  }
  .pick-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent);}
  .pick-btn .sub{display:block;font-weight:400;font-size:12.5px;color:var(--ink-soft);margin-top:4px;}
  .pick-btn:hover .sub{color:rgba(255,255,255,0.85);}

  .filter-chip{
    display:inline-flex;align-items:center;gap:8px;background:var(--bg);border:2px solid var(--line-strong);
    padding:6px 12px;font-size:13px;font-weight:600;margin-bottom:14px;
  }
  .filter-chip button{background:none;border:none;cursor:pointer;font-weight:700;color:var(--ink-soft);font-size:14px;padding:0;}
  .filter-chip button:hover{color:var(--danger);}

  .backlink{
    display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--ink-soft);
    font-family:'Inter',sans-serif;font-size:14px;font-weight:600;cursor:pointer;padding:0;margin-bottom:16px;
  }
  .backlink:hover{color:var(--ink);}

  input[type=text],input[type=date],input[type=number],input[type=password],select{
    font-family:'Inter',sans-serif;font-size:14px;padding:9px 10px;border:2px solid var(--line-strong);background:#fff;color:var(--ink);
  }
  label{font-size:12.5px;font-weight:600;color:var(--ink-soft);display:block;margin-bottom:4px;}
  .field{margin-bottom:12px;}
  .btn{
    font-family:'Inter',sans-serif;font-weight:700;font-size:14px;padding:10px 18px;
    background:var(--ink);color:#fff;border:2px solid var(--ink);cursor:pointer;
  }
  .btn:hover{background:#000;}
  .btn.accent{background:var(--accent);border-color:var(--accent);}
  .btn.accent:hover{background:#C24E19;}
  .btn.ghost{background:transparent;color:var(--ink);}
  .btn.ghost:hover{background:var(--bg);}
  .btn.danger{background:var(--danger);border-color:var(--danger);}
  .btn.small{padding:6px 10px;font-size:12.5px;}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}

  table{width:100%;border-collapse:collapse;margin-top:6px;}
  th{text-align:left;font-size:12px;text-transform:none;color:var(--ink-soft);font-weight:700;padding:8px 10px;border-bottom:2px solid var(--line-strong);}
  td{padding:10px 10px;border-bottom:1px solid var(--line);font-size:14.5px;}
  tr.row-danger td{background:var(--danger-bg);}
  tr.row-danger td:first-child{box-shadow:inset 4px 0 0 var(--danger);}
  tr.row-warn td{background:var(--warn-bg);}
  tr.row-warn td:first-child{box-shadow:inset 4px 0 0 var(--warn);}
  tr.row-ok td{background:var(--ok-bg);}
  tr.row-ok td:first-child{box-shadow:inset 4px 0 0 var(--ok);}
  .badge{display:inline-block;padding:4px 10px;font-size:12.5px;font-weight:700;}
  .badge.ok{background:var(--ok-bg);color:var(--ok);}
  .badge.warn{background:var(--warn-bg);color:var(--warn);}
  .badge.danger{background:var(--danger-bg);color:var(--danger);}
  .badge.none{background:var(--none-bg);color:var(--none);}

  .siz-card-list{display:flex;flex-direction:column;gap:10px;margin-top:6px;}
  .siz-card{border:2px solid var(--line-strong);padding:14px 16px;background:#fff;}
  .siz-card.ok{background:var(--ok-bg);border-color:var(--ok);}
  .siz-card.warn{background:var(--warn-bg);border-color:var(--warn);}
  .siz-card.danger{background:var(--danger-bg);border-color:var(--danger);}
  .siz-card.none{background:var(--none-bg);border-color:var(--none);}
  .siz-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .siz-card-name{font-weight:700;font-size:15.5px;}
  .siz-card-meta{font-size:13px;color:var(--ink-soft);margin-top:6px;line-height:1.5;}
  .siz-card-meta b{color:var(--ink);font-weight:700;}
  .siz-card-status{font-weight:800;font-size:13.5px;white-space:nowrap;padding:5px 10px;flex-shrink:0;}
  .siz-card-status.ok{background:var(--ok);color:#fff;}
  .siz-card-status.warn{background:var(--warn);color:#fff;}
  .siz-card-status.danger{background:var(--danger);color:#fff;}
  .siz-card-status.none{background:var(--none);color:#fff;}

  @media (max-width:640px){
    #app{padding:0 12px 60px;}
    .topbar{padding:18px 0 14px;margin-bottom:18px;gap:10px;}
    .brand-mark{font-size:22px;padding:3px 8px;}
    .brand-sub{font-size:12px;}
    .tab{padding:9px 12px;font-size:13px;}
    .panel{padding:16px;}
    .grid-buttons{grid-template-columns:1fr;}
    .qr-list{grid-template-columns:1fr;}
    .person-name{font-size:18px;}
    input[type=text],input[type=date],input[type=number],input[type=password],select{font-size:16px;}
    .row{flex-direction:column;align-items:stretch;}
    .row .btn{width:100%;}
  }

  .empty{color:var(--ink-soft);font-size:14.5px;padding:10px 0;}
  .hint{color:var(--ink-soft);font-size:13.5px;margin-top:4px;}

  .accordion-item{border:2px solid var(--line-strong);margin-bottom:12px;}
  .accordion-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;cursor:pointer;background:#fff;gap:12px;}
  .accordion-head:hover{background:var(--bg);}
  .accordion-head-title{flex:1;min-width:0;}
  .accordion-body{padding:16px;border-top:2px solid var(--line-strong);display:none;}
  .accordion-body.open{display:block;}
  .accordion-item h3{font-size:16px;}

  .emp-block{border:1px solid var(--line);padding:12px;margin-bottom:10px;}
  .emp-block-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;gap:10px;}
  .emp-block-head strong{font-size:14.5px;display:block;}
  .emp-block-head .meta{font-size:12.5px;color:var(--ink-soft);}
  .siz-row-months{color:var(--ink-soft);font-size:12.5px;}
  .siz-date-input{width:150px;}
  .clear-x{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:14px;padding:0 4px;}
  .clear-x:hover{color:var(--danger);}

  .person-card{padding:16px 0 4px;}
  .person-name{font-size:20px;}
  .person-meta{color:var(--ink-soft);font-size:14px;margin-top:4px;}
  .person-meta span{margin-right:14px;}

  .qr-page{display:flex;flex-direction:column;gap:24px;}
  .qr-main{display:flex;gap:24px;align-items:center;flex-wrap:wrap;padding:24px;border:2px solid var(--line-strong);background:#fff;}
  .qr-box{background:#fff;padding:12px;border:2px solid var(--line-strong);}
  .qr-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;}
  .qr-card{border:2px solid var(--line-strong);padding:16px;text-align:center;background:#fff;}
  .qr-card .qr-box{margin:0 auto 10px;width:fit-content;}
  .qr-card .name{font-weight:700;font-size:14.5px;}

  .qr-footer{display:flex;align-items:center;gap:20px;margin-top:18px;padding-top:16px;border-top:2px dashed var(--line-strong);flex-wrap:wrap;}
  .qr-footer-field{font-size:13.5px;}
  .qr-footer-field label{margin-bottom:2px;}
  .qr-footer-field .value{font-weight:700;font-size:15px;border-bottom:1.5px solid var(--line-strong);padding-bottom:2px;min-width:130px;display:inline-block;}
  .stamp-box{
    width:92px;height:92px;border:2px dashed var(--line-strong);border-radius:50%;
    display:flex;align-items:center;justify-content:center;text-align:center;
    color:var(--ink-soft);font-size:11px;font-weight:600;line-height:1.3;flex-shrink:0;
  }
  .qr-card .qr-footer{margin-top:12px;padding-top:12px;justify-content:center;gap:12px;}
  .qr-card .stamp-box{width:64px;height:64px;font-size:9.5px;}
  .qr-card .qr-footer-field .value{min-width:90px;font-size:13px;}

  .loading{color:var(--ink-soft);padding:40px 0;text-align:center;}

  .siz-toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#fff;padding:10px 18px;font-size:13.5px;font-weight:600;
    opacity:0;pointer-events:none;transition:opacity .2s ease, transform .2s ease;z-index:50;
    max-width:90vw;text-align:center;
  }
  .siz-toast.error{background:var(--danger);}
  .siz-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .banner-warn{
    background:var(--warn-bg);border:2px solid var(--warn);color:#7A5205;
    padding:14px 16px;font-size:13.5px;margin-bottom:18px;display:flex;justify-content:space-between;
    align-items:center;gap:12px;flex-wrap:wrap;
  }
  .banner-warn .btn{white-space:nowrap;}

  .lock-screen{max-width:360px;margin:40px auto;text-align:center;}
  .lock-screen .btn{width:100%;margin-top:10px;}
  .lock-screen input{width:100%;text-align:center;letter-spacing:4px;font-size:18px;}
  .lock-error{color:var(--danger);font-size:13px;margin-top:8px;min-height:16px;}

  @media print{
    body *{visibility:hidden;}
    #print-area, #print-area *{visibility:visible;}
    #print-area{position:absolute;top:0;left:0;width:100%;padding:20px;}
    .no-print{display:none !important;}
  }
</style>
</head>

  <main id="view-check" class="view active"></main>

  <main id="view-qr" class="view"></main>
</div>

  function addMonths(dateStr, months){
    var d = new Date(dateStr + "T00:00:00");
    var res = new Date(d);
    res.setMonth(res.getMonth() + Number(months));
    return res;
  }

  function fmtDate(d){
    if (typeof d === "string") d = new Date(d + "T00:00:00");
    var dd = String(d.getDate()).padStart(2,"0");
    var mm = String(d.getMonth()+1).padStart(2,"0");
    var yyyy = d.getFullYear();
    return dd + "." + mm + "." + yyyy;
  }

  function statusForDate(testDate, months){
    if (!testDate) return { code:"none", label:"Нет данных", next:null };
    var next = addMonths(testDate, months);
    var now = new Date();
    now.setHours(0,0,0,0);
    var days = Math.round((next - now) / 86400000);
    if (days < 0) return { code:"danger", label:"Просрочено", next: next, days: days };
    if (days <= 30) return { code:"warn", label:"Истекает скоро", next: next, days: days };
    return { code:"ok", label:"Действителен", next: next, days: days };
  }

  function seedData(){

  function migrateEquipment(d){
    d.departments.forEach(function(dept){
      dept.employees.forEach(function(emp){
        if (Array.isArray(emp.equipment) || !emp.equipment || typeof emp.equipment !== "object") {
          emp.equipment = {};
        }
      });
    });
    return d;
  }

  function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

  // Try to read a key a few times before giving up — a single failed read
  // (flaky connection) must never be treated as "no data yet".
  async function getWithRetry(key, attempts){
    var lastErr = null;
    for (var i = 0; i < attempts; i++){
      try {
        return await window.storage.get(key, true);
      } catch(e){
        lastErr = e;
        if (i < attempts - 1) await sleep(350 * (i + 1));
      }
    }
    throw lastErr;
  }

  var readError = false; // true = we could NOT confirm whether real data exists; never overwrite in this state

  async function loadData(){
    readError = false;
    try {
      var res = await getWithRetry(DATA_KEY, 3);
      if (res && res.value) {
        data = migrateEquipment(JSON.parse(res.value));
        return;
      }
    } catch(e){
      // Reading the main data failed even after retries. Before assuming
      // "this is a brand-new instance", check the initialization marker —
      // if the marker exists, real data exists too and this is just a
      // connection problem, so we must NOT overwrite it with the seed.
      try {
        var marker = await getWithRetry(MARKER_KEY, 2);
        if (marker && marker.value) {
          readError = true;
          data = seedData(); // shown temporarily, NOT saved
          return;
        }
      } catch(e2){
        // marker also unreadable — fall through to first-run handling below,
        // since this looks like a genuinely fresh, never-initialized instance.
      }
    }
    // Genuinely first run: seed once and record the marker.
    data = seedData();
    var ok = await saveData();
    if (ok) {
      try { await window.storage.set(MARKER_KEY, "yes", true); } catch(e3){}
    } else {
      readError = true;
    }
  }

  async function saveData(){
    try {
      var result = await window.storage.set(DATA_KEY, JSON.stringify(data), true);
      return !!result;
    } catch(e){
      console.error("Ошибка сохранения", e);
      return false;
    }
  }

  // Applies a mutation to `data`, saves it, and rolls back on failure so the
  // UI never shows a change that wasn't actually persisted.
  async function mutateAndSave(mutateFn){
    var snapshot = JSON.stringify(data);
    mutateFn();
    var ok = await saveData();
    if (!ok) {
      data = JSON.parse(snapshot);
      showToast("Не удалось сохранить изменения. Проверьте интернет-соединение и повторите.", true);
      return false;
    }
    showToast("Сохранено", false);
    return true;
  }

  var toastTimer = null;

    if (!el) {

      document.body.appendChild(el);
    }
    el.textContent = text;
    el.className = "siz-toast" + (isError ? " error" : "") + " show";
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove("show"); }, isError ? 4500 : 1800);
  }

        var grid = document.createElement("div");
        grid.className = "grid-buttons";
        shown.forEach(function(p){
          var b = document.createElement("button");
          b.className = "pick-btn";
          var sub = p.dept.name + (p.emp.position ? " · " + p.emp.position : "");
          b.innerHTML = escapeHtml(p.emp.name) + '<span class="sub">'+escapeHtml(sub)+'</span>';
          b.addEventListener("click", function(){
            check.step = 2; check.empDeptId = p.dept.id; check.empId = p.emp.id;
            renderCheck();
          });
          grid.appendChild(b);
        });
        resultsWrap.appendChild(grid);
        if (list.length > MAX) {
          var more = document.createElement("div");
          more.className = "hint";
          more.style.marginTop = "10px";
          more.textContent = "Показаны первые "+MAX+" из "+list.length+" — уточните запрос.";
          resultsWrap.appendChild(more);
        }
      }

      drawList("");
      searchWrap.querySelector("#emp-search").addEventListener("input", function(e){
        drawList(e.target.value);
      });
    }

    if (check.step === 2) {
      var dept = getDept(check.empDeptId);
      var emp = dept ? getEmp(dept, check.empId) : null;
      if (!dept || !emp) { check.step = 1; return renderCheck(); }
      var back = document.createElement("button");
      back.className = "backlink";
      back.innerHTML = "← Найти другого сотрудника";
      back.addEventListener("click", function(){ check.step = 1; renderCheck(); });
      panel.appendChild(back);

      var card = document.createElement("div");
      card.className = "person-card";
      card.innerHTML = '<div class="person-name">'+escapeHtml(emp.name)+'</div>'+
        '<div class="person-meta">'+
          '<span>'+escapeHtml(dept.name)+'</span>'+
          (emp.position ? '<span>'+escapeHtml(emp.position)+'</span>' : '') +
          (emp.tabNumber ? '<span>Таб. № '+escapeHtml(String(emp.tabNumber))+'</span>' : '') +
        '</div>';
      panel.appendChild(card);

      var list = document.createElement("div");
      list.className = "siz-card-list";
      SIZ_CATALOG.forEach(function(cat){
        var rec = emp.equipment[cat.id];
        var testDate = rec && rec.testDate ? rec.testDate : null;
        var st = statusForDate(testDate, cat.months);
        var cardEl = document.createElement("div");
        cardEl.className = "siz-card " + st.code;
        cardEl.innerHTML =
          '<div class="siz-card-top">'+
            '<div class="siz-card-name">'+escapeHtml(cat.name)+'</div>'+
            '<div class="siz-card-status '+st.code+'">'+st.label+'</div>'+
          '</div>'+
          '<div class="siz-card-meta">'+
            'Периодичность: <b>'+cat.months+' мес.</b><br>'+
            'Дата испытания: <b>'+(testDate ? fmtDate(testDate) : '—')+'</b><br>'+
            'Следующая проверка: <b>'+(st.next ? fmtDate(st.next) : '—')+'</b>'+
          '</div>';
        list.appendChild(cardEl);
      });
      panel.appendChild(list);
    }
  }

  function pluralPeople(n){
    var m = n % 100;
    if (m >= 11 && m <= 14) return "сотрудников";
    var l = n % 10;
    if (l === 1) return "сотрудник";
    if (l >= 2 && l <= 4) return "сотрудника";
    return "сотрудников";
  }

  function escapeHtml(s){
    var d = document.createElement("div");
    d.textContent = (s === undefined || s === null) ? "" : s;
    return d.innerHTML;
  }

  // ---------- ADMIN LOCK ----------
  function renderAdmin(){
    var root = document.getElementById("view-admin");
    root.innerHTML = "";
    if (!data || adminPin === null) { root.innerHTML = '<div class="loading">Загрузка…</div>'; return; }

    if (!adminUnlocked) {
      var lock = document.createElement("div");
      lock.className = "lock-screen panel";
      lock.innerHTML =
        '<h2 style="font-size:18px;margin-bottom:6px;">Режим управления</h2>'+
        '<p class="hint" style="margin-bottom:14px;">Введите PIN-код, чтобы добавлять и удалять сотрудников и сроки СИЗ.</p>'+
        '<input type="password" id="pin-input" placeholder="PIN" inputmode="numeric">'+
        '<div class="lock-error" id="pin-error"></div>';
      var unlockBtn = document.createElement("button");
      unlockBtn.className = "btn accent";
      unlockBtn.textContent = "Войти";
      unlockBtn.addEventListener("click", tryUnlock);
      lock.appendChild(unlockBtn);
      root.appendChild(lock);
      var pinInput = lock.querySelector("#pin-input");
      pinInput.addEventListener("keydown", function(e){ if (e.key === "Enter") tryUnlock(); });
      pinInput.focus();
      return;
    }

    renderAdminContent(root);
  }

  function tryUnlock(){
    var val = document.getElementById("pin-input").value.trim();
    if (val === adminPin) {
      adminUnlocked = true;
      renderAdmin();
    } else {
      document.getElementById("pin-error").textContent = "Неверный PIN-код";
    }
  }

  // ---------- ADMIN CONTENT ----------
  function renderAdminContent(root){
    maybeRenderErrorBanner(root);
    var topRow = document.createElement("div");
    topRow.className = "panel";
    topRow.style.display = "flex";
    topRow.style.justifyContent = "space-between";
    topRow.style.alignItems = "center";
    topRow.style.flexWrap = "wrap";
    topRow.style.gap = "12px";
    topRow.innerHTML = '<div><h2 style="font-size:18px;">Управление сотрудниками и сроками СИЗ</h2><p class="hint">Изменения видны всем, кто открывает эту ссылку.</p></div>';
    var rightBtns = document.createElement("div");
    rightBtns.style.display = "flex";
    rightBtns.style.gap = "8px";
    var changePinBtn = document.createElement("button");
    changePinBtn.className = "btn ghost small";
    changePinBtn.textContent = "Сменить PIN";
    changePinBtn.addEventListener("click", async function(){
      var np = prompt("Новый PIN-код (только для этой вкладки):");
      if (np && np.trim()) {
        var ok = await savePin(np.trim());
        if (ok) showToast("PIN обновлён.", false);
        else showToast("Не удалось сохранить новый PIN. Проверьте соединение.", true);
      }
    });
    var lockBtn = document.createElement("button");
    lockBtn.className = "btn ghost small";
    lockBtn.textContent = "Выйти";
    lockBtn.addEventListener("click", function(){ adminUnlocked = false; renderAdmin(); });
    rightBtns.appendChild(changePinBtn);
    rightBtns.appendChild(lockBtn);
    topRow.appendChild(rightBtns);
    root.appendChild(topRow);

    var catalogPanel = document.createElement("div");
    catalogPanel.className = "panel";
    var catList = SIZ_CATALOG.map(function(c){ return escapeHtml(c.name) + " — " + c.months + " мес."; }).join("; ");
    catalogPanel.innerHTML = '<h3 style="font-size:15px;margin-bottom:6px;">Периодичность испытаний СИЗ (справочно)</h3><p class="hint">'+catList+'</p>';
    root.appendChild(catalogPanel);

    var addPanel = document.createElement("div");
    addPanel.className = "panel";
    addPanel.innerHTML = '<h2 style="font-size:18px;margin-bottom:12px;">Добавить подразделение</h2>';
    var row = document.createElement("div");
    row.className = "row";
    row.innerHTML = '<div class="field" style="margin-bottom:0;"><label>Название подразделения</label><input type="text" id="new-dept-name" placeholder="например, Электроцех"></div>';
    var addBtn = document.createElement("button");
    addBtn.className = "btn accent";
    addBtn.textContent = "Добавить";
    addBtn.addEventListener("click", async function(){
      var input = document.getElementById("new-dept-name");
      var name = input.value.trim();
      if (!name) return;
      await mutateAndSave(function(){
        data.departments.push({ id: uid(), name: name, employees: [] });
      });
      renderAdmin();
    });
    row.appendChild(addBtn);
    addPanel.appendChild(row);
    root.appendChild(addPanel);

    if (data.departments.length === 0) {
      var e = document.createElement("div");
      e.className = "panel";
      e.innerHTML = '<div class="empty">Подразделений пока нет. Добавьте первое выше.</div>';
      root.appendChild(e);
      return;
    }

    data.departments.forEach(function(dept){
      var item = document.createElement("div");
      item.className = "accordion-item";

      var head = document.createElement("div");
      head.className = "accordion-head";
      var titleDiv = document.createElement("div");
      titleDiv.className = "accordion-head-title";
      titleDiv.innerHTML = '<h3>'+escapeHtml(dept.name)+'</h3><div class="hint">'+dept.employees.length+' '+pluralPeople(dept.employees.length)+'</div>';
      head.appendChild(titleDiv);
      var delDeptBtn = document.createElement("button");
      delDeptBtn.className = "btn danger small";
      delDeptBtn.textContent = "Удалить подразделение";
      delDeptBtn.addEventListener("click", async function(ev){
        ev.stopPropagation();
        if (!confirm('Удалить подразделение "'+dept.name+'" со всеми сотрудниками и СИЗ?')) return;
        await mutateAndSave(function(){
          data.departments = data.departments.filter(function(d){return d.id!==dept.id;});
        });
        renderAdmin();
      });
      head.appendChild(delDeptBtn);
      head.addEventListener("click", function(){
        adminOpen[dept.id] = !adminOpen[dept.id];
        renderAdmin();
      });
      item.appendChild(head);

      var body = document.createElement("div");
      body.className = "accordion-body" + (adminOpen[dept.id] ? " open" : "");

      // add employee form
      var addEmpBox = document.createElement("div");
      addEmpBox.className = "panel";
      addEmpBox.style.marginBottom = "16px";
      addEmpBox.innerHTML = '<label style="margin-bottom:10px;">Добавить сотрудника</label>';
      var addEmpRow = document.createElement("div");
      addEmpRow.className = "row";
      addEmpRow.innerHTML =
        '<div class="field" style="margin-bottom:0;flex:1;min-width:220px;"><label>ФИО</label><input type="text" class="new-emp-name" placeholder="Фамилия Имя Отчество" style="width:100%;"></div>'+
        '<div class="field" style="margin-bottom:0;flex:1;min-width:200px;"><label>Должность</label><input type="text" class="new-emp-position" placeholder="например, Инженер электросвязи" style="width:100%;"></div>'+
        '<div class="field" style="margin-bottom:0;width:140px;"><label>Табельный №</label><input type="text" class="new-emp-tab" placeholder="напр. 10154"></div>';
      var addEmpBtn = document.createElement("button");
      addEmpBtn.className = "btn accent small";
      addEmpBtn.textContent = "Добавить сотрудника";
      addEmpBtn.addEventListener("click", async function(){
        var nameInp = addEmpRow.querySelector(".new-emp-name");
        var posInp = addEmpRow.querySelector(".new-emp-position");
        var tabInp = addEmpRow.querySelector(".new-emp-tab");
        var name = nameInp.value.trim();
        if (!name) { nameInp.focus(); return; }
        adminOpen[dept.id] = true;
        await mutateAndSave(function(){
          dept.employees.push({
            id: uid(),
            name: name,
            position: posInp.value.trim(),
            tabNumber: tabInp.value.trim(),
            equipment: {}
          });
        });
        renderAdmin();
      });
      addEmpRow.appendChild(addEmpBtn);
      addEmpBox.appendChild(addEmpRow);
      body.appendChild(addEmpBox);

      if (dept.employees.length > 0) {
        var bulk = getBulk(dept.id);
        var bulkBox = document.createElement("div");
        bulkBox.className = "panel";
        bulkBox.style.marginBottom = "16px";
        bulkBox.style.background = "var(--bg)";

        var bulkTitle = document.createElement("div");
        bulkTitle.innerHTML = '<label style="margin-bottom:6px;">Массовая простановка даты проверки СИЗ</label>'+
          '<p class="hint" style="margin-bottom:10px;">Отметьте галочками сотрудников (или выберите всех и уберите лишних), выберите СИЗ и дату испытания, затем нажмите «Проставить».</p>';
        bulkBox.appendChild(bulkTitle);

        var bulkRow = document.createElement("div");
        bulkRow.className = "row";

        var catField = document.createElement("div");
        catField.className = "field";
        catField.style.marginBottom = "0";
        catField.style.minWidth = "260px";
        catField.innerHTML = '<label>Средство защиты</label>';
        var catSelect = document.createElement("select");
        catSelect.style.width = "100%";
        SIZ_CATALOG.forEach(function(cat){
          var opt = document.createElement("option");
          opt.value = cat.id;
          opt.textContent = cat.name;
          if (cat.id === bulk.category) opt.selected = true;
          catSelect.appendChild(opt);
        });
        catSelect.addEventListener("change", function(){ bulk.category = catSelect.value; });
        catField.appendChild(catSelect);
        bulkRow.appendChild(catField);

        var dateField = document.createElement("div");
        dateField.className = "field";
        dateField.style.marginBottom = "0";
        dateField.innerHTML = '<label>Дата испытания</label>';
        var bulkDateInput = document.createElement("input");
        bulkDateInput.type = "date";
        bulkDateInput.value = bulk.date;
        bulkDateInput.addEventListener("change", function(){ bulk.date = bulkDateInput.value; });
        dateField.appendChild(bulkDateInput);
        bulkRow.appendChild(dateField);

        var bulkSelCount = Object.keys(bulk.selected).filter(function(id){ return bulk.selected[id]; }).length;
        var applyBulkBtn = document.createElement("button");
        applyBulkBtn.className = "btn accent";
        applyBulkBtn.textContent = "Проставить дату выбранным (" + bulkSelCount + ")";
        applyBulkBtn.disabled = bulkSelCount === 0 || !bulk.date;
        applyBulkBtn.addEventListener("click", async function(){
          if (!bulk.date) return;
          var ids = Object.keys(bulk.selected).filter(function(id){ return bulk.selected[id]; });
          if (ids.length === 0) return;
          await mutateAndSave(function(){
            ids.forEach(function(id){
              var e = getEmp(dept, id);
              if (e) e.equipment[bulk.category] = { testDate: bulk.date };
            });
          });
          bulk.selected = {};
          renderAdmin();
        });
        bulkRow.appendChild(applyBulkBtn);
        bulkBox.appendChild(bulkRow);

        var selectAllWrap = document.createElement("label");
        selectAllWrap.style.display = "flex";
        selectAllWrap.style.alignItems = "center";
        selectAllWrap.style.gap = "8px";
        selectAllWrap.style.marginTop = "12px";
        selectAllWrap.style.fontWeight = "600";
        selectAllWrap.style.fontSize = "13.5px";
        selectAllWrap.style.cursor = "pointer";
        var selectAllCb = document.createElement("input");
        selectAllCb.type = "checkbox";
        var allChecked = dept.employees.every(function(e){ return !!bulk.selected[e.id]; });
        selectAllCb.checked = allChecked;
        selectAllCb.addEventListener("change", function(){
          if (selectAllCb.checked) {
            dept.employees.forEach(function(e){ bulk.selected[e.id] = true; });
          } else {
            bulk.selected = {};
          }
          renderAdmin();
        });
        selectAllWrap.appendChild(selectAllCb);
        var selectAllText = document.createElement("span");
        selectAllText.textContent = "Выбрать всех сотрудников подразделения";
        selectAllWrap.appendChild(selectAllText);
        bulkBox.appendChild(selectAllWrap);

        body.appendChild(bulkBox);
      }

      if (dept.employees.length === 0) {
        var noEmp = document.createElement("div");
        noEmp.className = "empty";
        noEmp.textContent = "В этом подразделении пока нет сотрудников.";
        body.appendChild(noEmp);
      }

      dept.employees.forEach(function(emp){
        var empBlock = document.createElement("div");
        empBlock.className = "emp-block";
        var empHead = document.createElement("div");
        empHead.className = "emp-block-head";

        var empInfoWrap = document.createElement("div");
        empInfoWrap.style.display = "flex";
        empInfoWrap.style.alignItems = "flex-start";
        empInfoWrap.style.gap = "10px";

        var empSelCb = document.createElement("input");
        empSelCb.type = "checkbox";
        empSelCb.style.marginTop = "4px";
        empSelCb.style.flexShrink = "0";
        empSelCb.checked = !!getBulk(dept.id).selected[emp.id];
        empSelCb.addEventListener("change", function(){
          var b = getBulk(dept.id);
          if (empSelCb.checked) b.selected[emp.id] = true; else delete b.selected[emp.id];
          renderAdmin();
        });
        empInfoWrap.appendChild(empSelCb);

        var metaBits = [];
        if (emp.position) metaBits.push(escapeHtml(emp.position));
        if (emp.tabNumber) metaBits.push("таб. № " + escapeHtml(String(emp.tabNumber)));
        var empInfoText = document.createElement("div");
        empInfoText.innerHTML = '<strong>'+escapeHtml(emp.name)+'</strong><div class="meta">'+metaBits.join(" · ")+'</div>';
        empInfoWrap.appendChild(empInfoText);

        empHead.appendChild(empInfoWrap);
        var delEmpBtn = document.createElement("button");
        delEmpBtn.className = "btn danger small";
        delEmpBtn.textContent = "Удалить сотрудника";
        delEmpBtn.addEventListener("click", async function(){
          if (!confirm('Удалить сотрудника "'+emp.name+'"?')) return;
          await mutateAndSave(function(){
            dept.employees = dept.employees.filter(function(x){return x.id!==emp.id;});
          });
          renderAdmin();
        });
        empHead.appendChild(delEmpBtn);
        empBlock.appendChild(empHead);

        var t = document.createElement("table");
        t.innerHTML = '<thead><tr><th>СИЗ</th><th>Периодичность</th><th>Дата испытания</th><th>Следующая проверка</th><th>Статус</th><th></th></tr></thead>';
        var tb = document.createElement("tbody");
        SIZ_CATALOG.forEach(function(cat){
          var rec = emp.equipment[cat.id];
          var testDate = rec && rec.testDate ? rec.testDate : "";
          var st = statusForDate(testDate || null, cat.months);
          var tr = document.createElement("tr");
          if (st.code === "danger" || st.code === "warn" || st.code === "ok") tr.className = "row-" + st.code;
          var tdName = document.createElement("td");
          tdName.textContent = cat.name;
          var tdMonths = document.createElement("td");
          tdMonths.className = "siz-row-months";
          tdMonths.textContent = cat.months + " мес.";
          var tdDate = document.createElement("td");
          var dateInput = document.createElement("input");
          dateInput.type = "date";
          dateInput.className = "siz-date-input";
          dateInput.value = testDate;
          var tdNext = document.createElement("td");
          tdNext.textContent = st.next ? fmtDate(st.next) : "—";
          var tdStatus = document.createElement("td");
          var badge = document.createElement("span");
          badge.className = "badge " + st.code;
          badge.textContent = st.label;
          tdStatus.appendChild(badge);
          var tdClear = document.createElement("td");
          var clearBtn = document.createElement("button");
          clearBtn.className = "clear-x";
          clearBtn.textContent = "×";
          clearBtn.title = "Очистить дату";
          clearBtn.addEventListener("click", async function(){
            await mutateAndSave(function(){ delete emp.equipment[cat.id]; });
            renderAdmin();
          });
          tdClear.appendChild(clearBtn);

          dateInput.addEventListener("change", async function(){
            await mutateAndSave(function(){
              if (!dateInput.value) { delete emp.equipment[cat.id]; }
              else { emp.equipment[cat.id] = { testDate: dateInput.value }; }
            });
            renderAdmin();
          });
          tdDate.appendChild(dateInput);

          tr.appendChild(tdName);
          tr.appendChild(tdMonths);
          tr.appendChild(tdDate);
          tr.appendChild(tdNext);
          tr.appendChild(tdStatus);
          tr.appendChild(tdClear);
          tb.appendChild(tr);
        });
        t.appendChild(tb);
        empBlock.appendChild(t);

        body.appendChild(empBlock);
      });

      item.appendChild(body);
      root.appendChild(item);
    });
  }

  // ---------- QR ----------
  function renderQr(){
    var root = document.getElementById("view-qr");
    root.innerHTML = "";
    if (!data) { root.innerHTML = '<div class="loading">Загрузка…</div>'; return; }

    var wrap = document.createElement("div");
    wrap.className = "qr-page";

    var printBtn = document.createElement("div");
    printBtn.className = "no-print";
    printBtn.innerHTML = '<p class="hint">Распечатайте QR-код и разместите его на стенде или в подразделении. При сканировании телефон откроет страницу поиска сотрудника.</p>';
    var pBtn = document.createElement("button");
    pBtn.className = "btn accent";
    pBtn.textContent = "Печать";
    pBtn.style.marginTop = "8px";
    pBtn.addEventListener("click", function(){ window.print(); });
    printBtn.appendChild(pBtn);
    wrap.appendChild(printBtn);

    var printArea = document.createElement("div");
    printArea.id = "print-area";

    var mainBox = document.createElement("div");
    mainBox.className = "qr-main";
    var qrDiv = document.createElement("div");
    qrDiv.className = "qr-box";
    mainBox.appendChild(qrDiv);
    var textDiv = document.createElement("div");
    textDiv.innerHTML = '<h2 style="font-size:20px;margin-bottom:8px;">Проверка сроков СИЗ</h2><p class="hint">Отсканируйте QR-код, найдите себя по фамилии и посмотрите сроки испытаний СИЗ.</p>';
    mainBox.appendChild(textDiv);

    var issueDate = fmtDate(new Date());
    var footer = document.createElement("div");
    footer.className = "qr-footer";
    footer.style.width = "100%";
    footer.innerHTML =
      '<div class="qr-footer-field"><label>Дата выдачи QR-кода</label><span class="value">'+issueDate+'</span></div>'+
      '<div class="qr-footer-field"><label>Ответственный (Ф.И.О., подпись)</label><span class="value">&nbsp;</span></div>';
    var stamp = document.createElement("div");
    stamp.className = "stamp-box";
    stamp.textContent = "М.П.";
    footer.appendChild(stamp);
    mainBox.appendChild(footer);

    printArea.appendChild(mainBox);

    var baseUrl = window.location.href.split("#")[0];
    new QRCode(qrDiv, { text: baseUrl, width: 160, height: 160, colorDark:"#14181C", colorLight:"#ffffff" });

    if (data.departments.length > 0) {
      var h = document.createElement("h3");
      h.style.fontSize = "16px";
      h.style.margin = "8px 0";
      h.textContent = "Отдельные QR-коды по подразделениям (сужают поиск до подразделения)";
      printArea.appendChild(h);
      var list = document.createElement("div");
      list.className = "qr-list";
      data.departments.forEach(function(dept){
        var card = document.createElement("div");
        card.className = "qr-card";
        var qb = document.createElement("div");
        qb.className = "qr-box";
        card.appendChild(qb);
        var name = document.createElement("div");
        name.className = "name";
        name.textContent = dept.name;
        card.appendChild(name);

        var cardFooter = document.createElement("div");
        cardFooter.className = "qr-footer";
        cardFooter.innerHTML =
          '<div class="qr-footer-field"><label>Дата выдачи</label><span class="value">'+issueDate+'</span></div>';
        var cardStamp = document.createElement("div");
        cardStamp.className = "stamp-box";
        cardStamp.textContent = "М.П.";
        cardFooter.appendChild(cardStamp);
        card.appendChild(cardFooter);

        list.appendChild(card);
        new QRCode(qb, { text: baseUrl + "#dept=" + dept.id, width: 130, height: 130, colorDark:"#14181C", colorLight:"#ffffff" });
      });
      printArea.appendChild(list);
    }

    wrap.appendChild(printArea);
    root.appendChild(wrap);
  }

  // ---------- Deep link on load ----------
  function applyHash(){
    var h = window.location.hash;
    if (h.indexOf("#dept=") === 0) {
      var id = h.replace("#dept=", "");
      if (getDept(id)) {
        check.deptFilter = id;
      }
    }
  }

  // ---------- Init ----------
  (async function init(){
    document.getElementById("view-check").innerHTML = '<div class="loading">Загрузка…</div>';
    await loadData();
    await loadPin();
    applyHash();
    renderCheck();
  })();

})();
</script>
</body>
