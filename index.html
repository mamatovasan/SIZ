  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1100px 620px at 92% -10%, rgba(89,189,238,0.35) 0%, rgba(89,189,238,0) 60%),
      radial-gradient(900px 500px at -10% 15%, rgba(14,125,194,0.14) 0%, rgba(14,125,194,0) 55%),
      linear-gradient(180deg, #EAF6FD 0%, #DDF0FA 42%, #CFE7F6 100%);
    background-attachment:fixed;
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Archivo',sans-serif;
    font-weight:800;
    letter-spacing:-0.01em;
    margin:0;
  }
  #app{max-width:980px;margin:0 auto;padding:0 20px 80px;}
  .topbar{
    display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;
    padding:26px 24px;border:3px solid var(--line-strong);margin:20px 0 28px;
    position:relative;
    border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-soft);
    background:
      linear-gradient(100deg, rgba(6,18,28,0.86) 0%, rgba(6,18,28,0.58) 45%, rgba(6,18,28,0.82) 100%),
      var(--hero-img) center 38%/cover no-repeat;
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-logo-box{background:#fff;border:2px solid var(--line-strong);padding:4px 10px;display:flex;align-items:center;border-radius:var(--radius-sm);}
  .brand-logo{height:32px;width:auto;display:block;}
  .brand-div{width:2px;height:30px;background:rgba(255,255,255,0.35);flex-shrink:0;}
  .brand-mark{font-family:'Archivo',sans-serif;font-weight:800;font-size:28px;background:linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);color:var(--accent-ink);padding:4px 10px;border-radius:var(--radius-sm);}

  .mid-photo-band{
    position:relative;
    height:260px;
    border:3px solid var(--line-strong);
    margin:28px 0;
    border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-soft);
    background:
      linear-gradient(90deg, rgba(6,18,28,0.72) 0%, rgba(6,18,28,0.15) 55%, rgba(6,18,28,0.55) 100%),

  .brand-sub{color:rgba(255,255,255,0.88);font-size:14px;}
  .tabs{display:flex;gap:4px;background:var(--surface);border:2px solid var(--line-strong);border-radius:var(--radius);padding:4px;box-shadow:var(--shadow-soft);}
  .tab{
    font-family:'Inter',sans-serif;font-weight:600;font-size:14px;color:var(--ink);

  }
  .tab.active{background:var(--ink);color:#fff;}
  .tab:not(.active):hover{background:var(--bg);}
  .view{display:none;}
  .view.active{display:block;}

  .steps{display:flex;gap:0;margin-bottom:28px;border:2px solid var(--line-strong);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-soft);}
  .step{flex:1;padding:12px 14px;border-right:2px solid var(--line-strong);}

  .step-num{font-family:'Archivo',sans-serif;font-weight:800;font-size:13px;color:var(--ink-soft);}

  .step.is-active .step-num{color:#fff;}
  .step.is-done{background:#fff;}
  .step-label{font-size:13px;font-weight:600;margin-top:2px;}

  .panel{background:var(--surface);border:2px solid var(--line-strong);padding:22px;border-radius:var(--radius);box-shadow:var(--shadow-soft);}
  .panel + .panel{margin-top:18px;}

  .grid-buttons{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;}
  .pick-btn{
    text-align:left;font-family:'Inter',sans-serif;font-weight:600;font-size:15px;
    background:#fff;border:2px solid var(--line-strong);padding:16px;cursor:pointer;color:var(--ink);
    border-radius:var(--radius-sm);transition:transform .12s ease, background .12s ease;
  }
  .pick-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent);transform:translateY(-1px);}
  .pick-btn .sub{display:block;font-weight:400;font-size:12.5px;color:var(--ink-soft);margin-top:4px;}
  .pick-btn:hover .sub{color:rgba(255,255,255,0.85);}

  .filter-chip{
    display:inline-flex;align-items:center;gap:8px;background:var(--bg);border:2px solid var(--line-strong);
    padding:6px 12px;font-size:13px;font-weight:600;margin-bottom:14px;border-radius:999px;
  }
  .filter-chip button{background:none;border:none;cursor:pointer;font-weight:700;color:var(--ink-soft);font-size:14px;padding:0;}
  .filter-chip button:hover{color:var(--danger);}

  .backlink{
    display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--ink-soft);
    font-family:'Inter',sans-serif;font-size:14px;font-weight:600;cursor:pointer;padding:0;margin-bottom:16px;
  }
  .backlink:hover{color:var(--ink);}

  input[type=text],input[type=date],input[type=number],input[type=password],select{
    font-family:'Inter',sans-serif;font-size:14px;padding:9px 10px;border:2px solid var(--line-strong);background:#fff;color:var(--ink);
    border-radius:var(--radius-sm);
  }
  label{font-size:12.5px;font-weight:600;color:var(--ink-soft);display:block;margin-bottom:4px;}
  .field{margin-bottom:12px;}
  .btn{
    font-family:'Inter',sans-serif;font-weight:700;font-size:14px;padding:10px 18px;
    background:var(--ink);color:#fff;border:2px solid var(--ink);cursor:pointer;border-radius:var(--radius-sm);
  }
  .btn:hover{background:#000;}
  .btn.accent{background:linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);border-color:var(--accent);}
  .btn.accent:hover{background:#0A5F94;border-color:#0A5F94;}
  .btn.ghost{background:transparent;color:var(--ink);}
  .btn.ghost:hover{background:var(--bg);}
  .btn.danger{background:var(--danger);border-color:var(--danger);}
  .btn.small{padding:6px 10px;font-size:12.5px;border-radius:7px;}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}

  table{width:100%;border-collapse:collapse;margin-top:6px;}
  th{text-align:left;font-size:12px;text-transform:none;color:var(--ink-soft);font-weight:700;padding:8px 10px;border-bottom:2px solid var(--line-strong);}
  td{padding:10px 10px;border-bottom:1px solid var(--line);font-size:14.5px;}
  tr.row-danger td{background:var(--danger-bg);}
  tr.row-danger td:first-child{box-shadow:inset 4px 0 0 var(--danger);}
  tr.row-warn td{background:var(--warn-bg);}
  tr.row-warn td:first-child{box-shadow:inset 4px 0 0 var(--warn);}
  tr.row-ok td{background:var(--ok-bg);}
  tr.row-ok td:first-child{box-shadow:inset 4px 0 0 var(--ok);}
  .badge{display:inline-block;padding:4px 10px;font-size:12.5px;font-weight:700;border-radius:999px;}
  .badge.ok{background:var(--ok-bg);color:var(--ok);}
  .badge.warn{background:var(--warn-bg);color:var(--warn);}
  .badge.danger{background:var(--danger-bg);color:var(--danger);}
  .badge.none{background:var(--none-bg);color:var(--none);}

  .siz-card-list{display:flex;flex-direction:column;gap:10px;margin-top:6px;}
  .siz-card{border:2px solid var(--line-strong);padding:14px 16px;background:#fff;border-radius:var(--radius-sm);}
  .siz-card.ok{background:var(--ok-bg);border-color:var(--ok);}
  .siz-card.warn{background:var(--warn-bg);border-color:var(--warn);}
  .siz-card.danger{background:var(--danger-bg);border-color:var(--danger);}
  .siz-card.none{background:var(--none-bg);border-color:var(--none);}
  .siz-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .siz-card-name{font-weight:700;font-size:15.5px;}
  .siz-card-meta{font-size:13px;color:var(--ink-soft);margin-top:6px;line-height:1.5;}
  .siz-card-meta b{color:var(--ink);font-weight:700;}
  .siz-card-status{font-weight:800;font-size:13.5px;white-space:nowrap;padding:5px 10px;flex-shrink:0;border-radius:999px;}
  .siz-card-status.ok{background:var(--ok);color:#fff;}
  .siz-card-status.warn{background:var(--warn);color:#fff;}
  .siz-card-status.danger{background:var(--danger);color:#fff;}
  .siz-card-status.none{background:var(--none);color:#fff;}

  .siz-card-photos{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
  .photo-thumb-btn{position:relative;border:2px solid var(--line-strong);padding:0;background:#fff;width:56px;height:56px;cursor:pointer;overflow:hidden;flex-shrink:0;border-radius:var(--radius-sm);}
  .photo-thumb-img{width:100%;height:100%;object-fit:cover;display:block;}
  .photo-thumb-count{position:absolute;bottom:0;right:0;background:var(--ink);color:#fff;font-size:10px;font-weight:700;padding:1px 4px;}
  .photo-thumb-delete{position:absolute;top:-7px;right:-7px;background:var(--danger);color:#fff;border:2px solid #fff;width:20px;height:20px;border-radius:50%;font-size:13px;line-height:1;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;z-index:2;}
  .photo-thumb-wrap{position:relative;display:inline-block;flex-shrink:0;}
  .photo-add-btn{white-space:nowrap;}
  .siz-photo-cell{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}

  .photo-lightbox-overlay{position:fixed;inset:0;background:rgba(12,42,61,0.85);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;}
  .photo-lightbox-box{background:#fff;max-width:min(560px,92vw);max-height:92vh;overflow:auto;position:relative;padding:16px;display:flex;flex-direction:column;align-items:center;gap:10px;border-radius:var(--radius);}
  .photo-lightbox-close{position:absolute;top:8px;right:8px;background:var(--ink);color:#fff;border:none;width:32px;height:32px;font-size:20px;line-height:1;cursor:pointer;border-radius:50%;}
  .photo-lightbox-img{max-width:100%;max-height:60vh;object-fit:contain;border-radius:var(--radius-sm);}
  .photo-lightbox-meta{width:100%;font-size:13px;color:var(--ink-soft);text-align:center;}
  .photo-lightbox-note{color:var(--ink);font-weight:600;margin-bottom:4px;}
  .photo-lightbox-nav{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;}

  @media (max-width:640px){
    #app{padding:0 12px 60px;}
    .topbar{padding:16px;margin:12px 0 18px;gap:10px;}
    .brand-mark{font-size:22px;padding:3px 8px;}
    .brand-logo{height:22px;}
    .brand-logo-box{padding:3px 6px;}
    .brand-div{display:none;}
    .brand-sub{font-size:12px;}
    .tab{padding:9px 12px;font-size:13px;}
    .panel{padding:16px;}
    .grid-buttons{grid-template-columns:1fr;}
    .qr-list{grid-template-columns:1fr;}
    .person-name{font-size:18px;}
    input[type=text],input[type=date],input[type=number],input[type=password],select{font-size:16px;}
    .row{flex-direction:column;align-items:stretch;}
    .row .btn{width:100%;}
  }

  .empty{color:var(--ink-soft);font-size:14.5px;padding:10px 0;}
  .hint{color:var(--ink-soft);font-size:13.5px;margin-top:4px;}

  .stats-bars{display:flex;flex-direction:column;gap:12px;}

  .stop-icon-img{background:var(--stop-icon) center/contain no-repeat;flex-shrink:0;}

  .stop-work-box{border-top:2px dashed var(--line-strong);margin-top:16px;padding-top:16px;}
  .stop-work-box.active{
    border:3px solid var(--danger);background:var(--danger-bg);
    padding:16px;margin-top:16px;display:flex;gap:14px;align-items:flex-start;border-radius:var(--radius-sm);
  }
  .stop-work-box .stop-icon-img{width:44px;height:44px;}
  .stop-work-title{font-weight:800;color:var(--danger);font-size:15px;margin-bottom:6px;}
  .stop-work-reason{font-size:14px;margin-bottom:6px;white-space:pre-wrap;}
  .stop-work-meta{font-size:12.5px;color:var(--ink-soft);}

  .stop-count-panel{
    border:3px solid var(--danger);background:var(--danger-bg);padding:18px 22px;
    display:flex;align-items:center;gap:16px;margin-bottom:18px;border-radius:var(--radius);box-shadow:var(--shadow-soft);
  }
  .stop-count-panel.zero{border-color:var(--ok);background:var(--ok-bg);}
  .stop-count-panel .stop-icon-img{width:52px;height:52px;}
  .stop-count-panel.zero .stop-icon-img{background:none;}
  .stop-count-text{font-family:'Archivo',sans-serif;font-weight:800;font-size:17px;color:var(--danger);}
  .stop-count-panel.zero .stop-count-text{color:var(--ok);}
  .stop-count-names{font-size:13px;color:var(--ink-soft);margin-top:4px;font-family:'Inter',sans-serif;font-weight:500;}
  .stop-name-link{background:none;border:none;padding:0;font:inherit;color:var(--danger);font-weight:700;cursor:pointer;text-decoration:underline;}
  .stop-name-link:hover{color:#8f261f;}

  .defect-count-panel{border:3px solid var(--warn);background:var(--warn-bg);padding:18px 22px;margin-bottom:16px;display:flex;align-items:center;gap:16px;cursor:pointer;border-radius:var(--radius);box-shadow:var(--shadow-soft);}
  .defect-count-panel.zero{border-color:var(--ok);background:var(--ok-bg);}
  .defect-count-icon{font-size:30px;flex-shrink:0;line-height:1;}
  .defect-count-text{font-family:'Archivo',sans-serif;font-weight:800;font-size:17px;color:var(--warn);}
  .defect-count-panel.zero .defect-count-text{color:var(--ok);}
  .defect-count-names{font-size:13px;color:var(--ink-soft);margin-top:4px;font-family:'Inter',sans-serif;font-weight:500;}
  .defect-count-link{background:none;border:none;padding:0;font:inherit;color:var(--warn);font-weight:700;cursor:pointer;text-decoration:underline;}
  .defect-count-link:hover{color:#8a6205;}

  .stop-banner{
    border:4px solid var(--danger);background:var(--danger-bg);padding:20px 24px;
    display:flex;align-items:center;gap:18px;margin-bottom:18px;border-radius:var(--radius);
  }
  .stop-banner .stop-icon-img{width:64px;height:64px;}
  .stop-banner-title{font-family:'Archivo',sans-serif;font-weight:800;font-size:18px;color:var(--danger);margin-bottom:4px;}
  .stop-banner-name{font-family:'Archivo',sans-serif;font-weight:800;font-size:22px;color:var(--ink);}

  .stop-desc{border:2px solid var(--danger);background:var(--danger-bg);padding:16px 20px;margin-top:18px;border-radius:var(--radius-sm);}
  .stop-desc-title{font-weight:800;color:var(--danger);font-size:14px;margin-bottom:8px;}
  .stop-desc-reason{font-size:14.5px;margin-bottom:8px;white-space:pre-wrap;}
  .stop-desc-meta{font-size:12.5px;color:var(--ink-soft);}
  .stats-row{display:flex;align-items:center;gap:12px;}
  .stats-label{width:170px;flex-shrink:0;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:8px;}
  .stats-bar-track{flex:1;background:var(--bg);height:20px;border:2px solid var(--line-strong);position:relative;border-radius:999px;overflow:hidden;}
  .stats-bar-fill{height:100%;min-width:2px;transition:width .3s ease;}
  .stats-count{width:90px;flex-shrink:0;text-align:right;font-size:13.5px;font-weight:700;}
  .stats-pct{font-weight:400;color:var(--ink-soft);font-size:12px;}
  @media (max-width:640px){
    .stats-label{width:105px;font-size:12px;}
    .stats-count{width:75px;font-size:12px;}
  }

  .accordion-item{border:2px solid var(--line-strong);margin-bottom:12px;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-soft);}
  .accordion-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;cursor:pointer;background:#fff;gap:12px;}
  .accordion-head:hover{background:var(--bg);}
  .accordion-head-title{flex:1;min-width:0;}
  .accordion-body{padding:16px;border-top:2px solid var(--line-strong);display:none;}
  .accordion-body.open{display:block;}
  .accordion-item h3{font-size:16px;}

  .emp-block{border:1px solid var(--line);padding:12px;margin-bottom:10px;border-radius:var(--radius-sm);}
  .emp-block-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;gap:10px;}
  .emp-block-head strong{font-size:14.5px;display:block;}
  .emp-block-head .meta{font-size:12.5px;color:var(--ink-soft);}

  .emp-row-compact{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);margin-bottom:4px;cursor:pointer;background:#fff;border-radius:10px;}
  .emp-row-compact:hover{background:var(--bg);}
  .emp-row-compact .emp-row-name{font-size:13.5px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .emp-row-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .emp-row-dot.ok{background:var(--ok);}
  .emp-row-dot.warn{background:var(--warn);}
  .emp-row-dot.danger{background:var(--danger);}
  .emp-row-dot.none{background:var(--none);}
  .emp-row-stop{font-size:11px;font-weight:700;color:#fff;background:var(--danger);padding:1px 6px;flex-shrink:0;}
  .emp-row-chevron{font-size:11px;color:var(--ink-soft);flex-shrink:0;width:14px;text-align:center;}
  .emp-block table{font-size:12.5px;}
  .emp-block th{font-size:11px;padding:6px 8px;}
  .emp-block td{padding:7px 8px;font-size:12.5px;}
  .emp-block .siz-date-input{width:130px;font-size:12.5px;}
  .emp-block .badge{font-size:11px;}
  .siz-row-months{color:var(--ink-soft);font-size:12.5px;}
  .siz-date-input{width:150px;}
  .clear-x{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:14px;padding:0 4px;}
  .clear-x:hover{color:var(--danger);}

  .person-card{padding:16px 0 4px;}
  .person-name{font-size:20px;}
  .person-meta{color:var(--ink-soft);font-size:14px;margin-top:4px;}
  .person-meta span{margin-right:14px;}

  .qr-page{display:flex;flex-direction:column;gap:24px;}

  .qr-box{background:#fff;padding:12px;border:2px solid var(--line-strong);}
  .qr-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;}
  .qr-card{border:2px dashed var(--line-strong);padding:12px;text-align:center;background:#fff;}
  .qr-card .qr-box{margin:0 auto 8px;width:fit-content;padding:8px;}
  .qr-card .name{font-weight:700;font-size:13px;}

  .qr-footer{display:flex;align-items:center;gap:20px;margin-top:18px;padding-top:16px;border-top:2px dashed var(--line-strong);flex-wrap:wrap;}

  .stamp-box{
    width:92px;height:92px;border:2px dashed var(--line-strong);border-radius:50%;
    display:flex;align-items:center;justify-content:center;text-align:center;
    color:var(--ink-soft);font-size:11px;font-weight:600;line-height:1.3;flex-shrink:0;
  }
  .qr-card .qr-footer{margin-top:8px;padding-top:8px;justify-content:center;gap:8px;}
  .qr-card .stamp-box{width:46px;height:46px;font-size:8px;}
  .qr-card .qr-footer-field .value{min-width:70px;font-size:11.5px;}

  .qr-list-uniform{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;}
  .qr-card-mini{border:2px dashed var(--line-strong);padding:10px;text-align:center;background:#fff;}
  .qr-card-mini .qr-box{margin:0 auto 6px;width:fit-content;padding:6px;}
  .qr-card-mini .name{font-weight:700;font-size:11px;line-height:1.3;}

  @media print{
    .qr-card{
      width:80mm;
      height:50mm;
      box-sizing:border-box;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      page-break-inside:avoid;
      break-inside:avoid;
    }
    .qr-card .qr-box{padding:4px;margin-bottom:4px;}
    .qr-list{grid-template-columns:repeat(auto-fill,minmax(84mm,1fr));gap:6mm;}

    .qr-card-mini{
      width:65mm;
      height:38mm;
      box-sizing:border-box;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding:6mm;
      page-break-inside:avoid;
      break-inside:avoid;
    }
    .qr-card-mini .qr-box{padding:2mm;margin-bottom:2mm;}
    .qr-list-uniform{grid-template-columns:repeat(auto-fill,minmax(69mm,1fr));gap:3mm;}
  }

  .loading{color:var(--ink-soft);padding:40px 0;text-align:center;}

  .siz-toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#fff;padding:10px 18px;font-size:13.5px;font-weight:600;
    opacity:0;pointer-events:none;transition:opacity .2s ease, transform .2s ease;z-index:50;
    max-width:90vw;text-align:center;
  }
  .siz-toast.error{background:var(--danger);}
  .siz-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .banner-warn{
    background:var(--warn-bg);border:2px solid var(--warn);color:#7A5205;
    padding:14px 16px;font-size:13.5px;margin-bottom:18px;display:flex;justify-content:space-between;
    align-items:center;gap:12px;flex-wrap:wrap;
  }
  .banner-warn .btn{white-space:nowrap;}

  .lock-screen{max-width:360px;margin:40px auto;text-align:center;}
  .lock-screen .btn{width:100%;margin-top:10px;}
  .lock-screen input{width:100%;text-align:center;letter-spacing:4px;font-size:18px;}
  .lock-error{color:var(--danger);font-size:13px;margin-top:8px;min-height:16px;}

  @media print{
    body *{visibility:hidden;}
    #print-area, #print-area *{visibility:visible;}
    #print-area{position:absolute;top:0;left:0;width:100%;padding:20px;}
    #personal-print-area, #personal-print-area *{visibility:visible;}
    #personal-print-area{position:absolute;top:0;left:0;width:100%;padding:20px;border:none !important;}
    .no-print{display:none !important;}
  }
</style>
</head>
<body>
<div id="app">

  // Reads an image file, downsizes it and re-encodes as JPEG so photos taken
  // on a phone don't bloat storage. Returns a data: URL.
  function compressImageFile(file, maxDim, quality){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onerror = function(){ reject(new Error("Не удалось прочитать файл")); };
      reader.onload = function(){
        var img = new Image();
        img.onerror = function(){ reject(new Error("Не удалось загрузить изображение")); };
        img.onload = function(){
          var w = img.width, h = img.height;
          var scale = Math.min(1, (maxDim || 1280) / Math.max(w, h));
          var cw = Math.max(1, Math.round(w * scale));
          var ch = Math.max(1, Math.round(h * scale));
          var canvas = document.createElement("canvas");
          canvas.width = cw; canvas.height = ch;
          var ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, cw, ch);
          try {
            resolve(canvas.toDataURL("image/jpeg", quality || 0.72));
          } catch(e){ reject(e); }
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  // Full-screen viewer for one or more photos, with optional prev/next paging
  // and an optional delete callback (used from the admin panel).
  function openPhotoLightbox(photos, startIndex, opts){
    opts = opts || {};
    var idx = startIndex || 0;
    var overlay = document.createElement("div");
    overlay.className = "photo-lightbox-overlay";
    document.body.appendChild(overlay);

    function render(){
      var p = photos[idx];
      overlay.innerHTML = "";
      var box = document.createElement("div");
      box.className = "photo-lightbox-box";

      var closeBtn = document.createElement("button");
      closeBtn.type = "button";
      closeBtn.className = "photo-lightbox-close";
      closeBtn.textContent = "×";
      closeBtn.addEventListener("click", function(){ overlay.remove(); });
      box.appendChild(closeBtn);

      var img = document.createElement("img");
      img.src = p.dataUrl;
      img.className = "photo-lightbox-img";
      box.appendChild(img);

      var dt = p.addedAt ? new Date(p.addedAt).toLocaleString("ru-RU") : "";
      var meta = document.createElement("div");
      meta.className = "photo-lightbox-meta";
      meta.innerHTML =
        (p.note ? '<div class="photo-lightbox-note">'+escapeHtml(p.note)+'</div>' : '') +
        (dt ? '<div class="photo-lightbox-date">'+escapeHtml(dt)+'</div>' : '');
      box.appendChild(meta);

      if (photos.length > 1) {
        var nav = document.createElement("div");
        nav.className = "photo-lightbox-nav";
        var prevBtn = document.createElement("button");
        prevBtn.type = "button";
        prevBtn.className = "btn small";
        prevBtn.textContent = "← Пред.";
        prevBtn.addEventListener("click", function(){ idx = (idx - 1 + photos.length) % photos.length; render(); });
        var counter = document.createElement("span");
        counter.textContent = (idx+1) + " / " + photos.length;
        var nextBtn = document.createElement("button");
        nextBtn.type = "button";
        nextBtn.className = "btn small";
        nextBtn.textContent = "След. →";
        nextBtn.addEventListener("click", function(){ idx = (idx + 1) % photos.length; render(); });
        nav.appendChild(prevBtn); nav.appendChild(counter); nav.appendChild(nextBtn);
        box.appendChild(nav);
      }

      if (opts.onDelete) {
        var delBtn = document.createElement("button");
        delBtn.type = "button";
        delBtn.className = "btn danger small";
        delBtn.textContent = "Удалить фото";
        delBtn.addEventListener("click", async function(){
          if (!confirm("Удалить это фото?")) return;
          var id = p.id;
          await opts.onDelete(id);
          var i = photos.findIndex(function(x){ return x.id === id; });
          if (i !== -1) photos.splice(i,1);
          if (photos.length === 0) { overlay.remove(); return; }
          idx = Math.min(idx, photos.length-1);
          render();
        });
        box.appendChild(delBtn);
      }

      overlay.appendChild(box);
    }

    overlay.addEventListener("click", function(e){ if (e.target === overlay) overlay.remove(); });
    render();
  }

  function todayISO(){
    var d = new Date();
    return d.toISOString().slice(0,10);
  }

  function addMonths(dateStr, months){
    var d = new Date(dateStr + "T00:00:00");
    var res = new Date(d);
    res.setMonth(res.getMonth() + Number(months));
    return res;
  }

  function fmtDate(d){
    if (typeof d === "string") d = new Date(d + "T00:00:00");
    var dd = String(d.getDate()).padStart(2,"0");
    var mm = String(d.getMonth()+1).padStart(2,"0");
    var yyyy = d.getFullYear();
    return dd + "." + mm + "." + yyyy;
  }

  function statusForDate(testDate, months){
    if (!testDate) return { code:"none", label:"Нет данных", next:null };
    var next = addMonths(testDate, months);
    var now = new Date();
    now.setHours(0,0,0,0);
    var days = Math.round((next - now) / 86400000);
    if (days < 0) return { code:"danger", label:"Просрочено", next: next, days: days };
    if (days <= 30) return { code:"warn", label:"Истекает скоро", next: next, days: days };
    return { code:"ok", label:"Действителен", next: next, days: days };
  }

  // Confidential per-employee access token used for personal QR deep links
  // (#p=<token>). Returns true if any token was newly generated.
  function ensureAccessTokens(d){
    var changed = false;
    d.departments.forEach(function(dept){
      dept.employees.forEach(function(emp){
        if (!emp.accessToken || typeof emp.accessToken !== "string") {
          emp.accessToken = uid() + uid();
          changed = true;
        }
      });
    });
    if (!Array.isArray(d.defectActs)) {
      d.defectActs = [];
      changed = true;
    }
    return changed;
  }

  function findByToken(token){
    if (!data || !token) return null;
    for (var i = 0; i < data.departments.length; i++){
      var d = data.departments[i];
      for (var j = 0; j < d.employees.length; j++){
        if (d.employees[j].accessToken === token) return { dept: d, emp: d.employees[j] };
      }
    }
    return null;
  }

  // Builds a Word-compatible .doc file (HTML wrapped with Word XML namespaces,
  // which Word opens natively, including embedded base64 photos) and
  // triggers a download. No external library needed.
  function downloadWordDoc(filename, bodyHtml){
    var pre =
      "<html xmlns:o='urn:schemas-microsoft-com:office:office' "+
      "xmlns:w='urn:schemas-microsoft-com:office:word' "+
      "xmlns='http://www.w3.org/TR/REC-html40'>"+
      "<head><meta charset='utf-8'><title>Акт</title>"+
      "<style>"+
      "body{font-family:Calibri, Arial, sans-serif;font-size:14px;color:#111;}"+
      "h1{font-size:18px;text-align:center;margin-bottom:4px;}"+
      "h2{font-size:13px;text-align:center;font-weight:normal;color:#444;margin-top:0;margin-bottom:22px;}"+
      "table{border-collapse:collapse;width:100%;margin-bottom:18px;}"+
      "td, th{border:1px solid #999;padding:8px 10px;font-size:13.5px;vertical-align:top;}"+
      "td.label{width:220px;background:#f2f2f2;font-weight:bold;}"+
      ".photo-block{text-align:center;margin:18px 0;}"+
      ".sign-block{margin-top:40px;}"+
      ".sign-line{display:inline-block;width:260px;border-bottom:1px solid #333;margin:0 8px;}"+
      "</style></head><body>";
    var post = "</body></html>";
    var fullHtml = pre + bodyHtml + post;
    var blob = new Blob(['\ufeff', fullHtml], { type: "application/msword" });
    var url = URL.createObjectURL(blob);
    var link = document.createElement("a");
    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 5000);
  }

  function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

  // Try to read a key a few times before giving up — a single failed read
  // (flaky connection) must never be treated as "no data yet".
  async function getWithRetry(key, attempts){
    var lastErr = null;
    for (var i = 0; i < attempts; i++){
      try {
        return await kvGet(key);
      } catch(e){
        lastErr = e;
        if (i < attempts - 1) await sleep(350 * (i + 1));
      }
    }
    throw lastErr;
  }

  var readError = false; // true = we could NOT confirm whether real data exists; never overwrite in this state

  async function loadData(){
    readError = false;
    try {
      var res = await getWithRetry(DATA_KEY, 3);
      if (res && res.value) {
        data = ensureSizCatalog(migrateEquipment(JSON.parse(res.value)));
        if (ensureAccessTokens(data)) {
          // Silently persist newly-minted personal tokens (best-effort;
          // if it fails, tokens still work for this session).
          saveData().catch(function(){});
        }
        return;
      }
    } catch(e){
      // Reading the main data failed even after retries. Before assuming
      // "this is a brand-new instance", check the initialization marker —
      // if the marker exists, real data exists too and this is just a
      // connection problem, so we must NOT overwrite it with the seed.
      try {
        var marker = await getWithRetry(MARKER_KEY, 2);
        if (marker && marker.value) {
          readError = true;
          data = ensureSizCatalog(seedData()); // shown temporarily, NOT saved
          ensureAccessTokens(data);
          return;
        }
      } catch(e2){
        // marker also unreadable — fall through to first-run handling below,
        // since this looks like a genuinely fresh, never-initialized instance.
      }
    }
    // Genuinely first run: seed once and record the marker.
    data = ensureSizCatalog(seedData());
    ensureAccessTokens(data);
    var ok = await saveData();
    if (ok) {
      try { await kvSet(MARKER_KEY, "yes"); } catch(e3){}
    } else {
      readError = true;
    }
  }

  var lastSaveError = "";
  function describeError(e){
    if (!e) return "неизвестная ошибка";
    if (typeof e === "string") return e;
    if (e.message) return e.message + (e.details ? " (" + e.details + ")" : "");
    try { return JSON.stringify(e); } catch(_e) { return String(e); }
  }

  async function saveData(){
    try {
      var result = await kvSet(DATA_KEY, JSON.stringify(data));
      return !!result;
    } catch(e){
      lastSaveError = describeError(e);
      console.error("Ошибка сохранения:", lastSaveError, e);
      return false;
    }
  }

  // Applies a mutation to `data`, saves it, and rolls back on failure so the
  // UI never shows a change that wasn't actually persisted.
  async function mutateAndSave(mutateFn){
    var snapshot = JSON.stringify(data);
    mutateFn();
    var ok = await saveData();
    if (!ok) {
      data = JSON.parse(snapshot);
      showToast("Не удалось сохранить изменения: " + lastSaveError, true);
      return false;
    }
    showToast("Сохранено", false);
    return true;
  }

  var toastTimer = null;
  function showToast(text, isError){
    var el = document.getElementById("siz-toast");
    if (!el) {
      el = document.createElement("div");
      el.id = "siz-toast";
      document.body.appendChild(el);
    }
    el.textContent = text;
    el.className = "siz-toast" + (isError ? " error" : "") + " show";
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove("show"); }, isError ? 4500 : 1800);
  }

      return false;

  function computeOverallStats(){
    var counts = { ok:0, warn:0, danger:0, none:0 };
    data.departments.forEach(function(dept){
      dept.employees.forEach(function(emp){
        SIZ_CATALOG.forEach(function(cat){
          var rec = emp.equipment[cat.id];
          var testDate = rec && rec.testDate ? rec.testDate : null;
          var st = statusForDate(testDate, cat.months);
          counts[st.code] = (counts[st.code] || 0) + 1;
        });
      });
    });
    return counts;
  }

  // Same as computeOverallStats but also keeps the underlying rows per
  // status code, so the dashboard can drill down into "who exactly".
  function computeOverallStatsDetailed(){
    var counts = { ok:0, warn:0, danger:0, none:0 };
    var details = { ok:[], warn:[], danger:[], none:[] };
    data.departments.forEach(function(dept){
      dept.employees.forEach(function(emp){
        SIZ_CATALOG.forEach(function(cat){
          var rec = emp.equipment[cat.id];
          var testDate = rec && rec.testDate ? rec.testDate : null;
          var st = statusForDate(testDate, cat.months);
          counts[st.code] = (counts[st.code] || 0) + 1;
          details[st.code].push({ dept: dept, emp: emp, cat: cat, testDate: testDate, st: st });
        });
      });
    });
    return { counts: counts, details: details };
  }

  function exportSizStatusListToExcel(rows, label){
    if (!window.XLSX) {
      showToast("Библиотека экспорта не загрузилась. Проверьте интернет-соединение.", true);
      return;
    }
    if (rows.length === 0) {
      showToast("Список пуст — экспортировать нечего.", true);
      return;
    }
    var out = rows.map(function(r){
      return {
        "ФИО": r.emp.name,
        "Подразделение": r.dept.name,
        "Должность": r.emp.position || "",
        "Табельный №": r.emp.tabNumber || "",
        "Вид СИЗ": r.cat.name,
        "Периодичность, мес.": r.cat.months,
        "Дата испытания": r.testDate ? fmtDate(r.testDate) : "",
        "Следующая проверка": r.st.next ? fmtDate(r.st.next) : "",
        "Статус": r.st.label
      };
    });
    var ws = XLSX.utils.json_to_sheet(out);
    ws["!cols"] = [
      { wch: 28 }, { wch: 30 }, { wch: 26 }, { wch: 12 },
      { wch: 26 }, { wch: 16 }, { wch: 16 }, { wch: 18 }, { wch: 16 }
    ];
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "СИЗ");
    var stamp = new Date().toISOString().slice(0,10);
    XLSX.writeFile(wb, label + "_" + stamp + ".xlsx");
  }

    exportBtn.style.margin = "8px 0 14px";
    exportBtn.addEventListener("click", function(){
      exportSizStatusListToExcel(rows, "СИЗ_" + code);
    });
    box.appendChild(exportBtn);

    if (rows.length === 0) {
      var emptyEl = document.createElement("div");
      emptyEl.className = "empty";
      emptyEl.textContent = "Список пуст.";
      box.appendChild(emptyEl);
    } else {
      var list = document.createElement("div");
      list.style.cssText = "display:flex;flex-direction:column;gap:8px;";
      // Sort worst-first for danger/warn (soonest / most overdue), otherwise by name
      rows.slice().sort(function(a,b){
        return a.emp.name.localeCompare(b.emp.name, "ru");
      }).forEach(function(r){
        var item = document.createElement("div");
        item.style.cssText = "border-bottom:1px solid var(--line);padding-bottom:8px;";
        var nameBtn = document.createElement("button");
        nameBtn.className = "stop-name-link";
        nameBtn.style.fontWeight = "700";
        nameBtn.textContent = r.emp.name;
        nameBtn.addEventListener("click", function(){
          overlay.remove();
          check.step = 2;
          check.empDeptId = r.dept.id;
          check.empId = r.emp.id;
          renderCheck();
        });
        item.appendChild(nameBtn);
        var meta = document.createElement("div");
        meta.className = "hint";
        meta.style.marginTop = "2px";
        meta.textContent = r.dept.name + " · " + r.cat.name + " · след. проверка: " + (r.st.next ? fmtDate(r.st.next) : "—");
        item.appendChild(meta);
        list.appendChild(item);
      });
      box.appendChild(list);
    }

    overlay.appendChild(box);
    document.body.appendChild(overlay);
  }

  function startWorkStop(emp, reason, stoppedBy){
    var record = {
      reason: reason,
      stoppedBy: stoppedBy,
      dateStarted: new Date().toISOString(),
      active: true,
      dateLifted: null,
      liftedBy: null
    };
    if (!emp.stopHistory) emp.stopHistory = [];
    emp.stopHistory.push(record);
    emp.workStop = record;
  }

  function liftWorkStop(emp, liftedBy){
    if (emp.workStop) {
      emp.workStop.active = false;
      emp.workStop.dateLifted = new Date().toISOString();
      emp.workStop.liftedBy = liftedBy || "не указано";
    }
    emp.workStop = null;
  }

  function exportStopHistoryToExcel(){
    if (!window.XLSX) {
      showToast("Библиотека экспорта не загрузилась. Проверьте интернет-соединение.", true);
      return;
    }
    var rows = [];
    data.departments.forEach(function(dept){
      dept.employees.forEach(function(emp){
        var history = emp.stopHistory || [];
        history.forEach(function(rec){
          rows.push({
            "ФИО": emp.name,
            "Подразделение": dept.name,
            "Должность": emp.position || "",
            "Табельный №": emp.tabNumber || "",
            "Статус": rec.active ? "Активно" : "Снято",
            "Причина остановки": rec.reason || "",
            "Кто остановил": rec.stoppedBy || "",
            "Дата остановки": rec.dateStarted ? fmtDate(rec.dateStarted.slice(0,10)) + " " + new Date(rec.dateStarted).toLocaleTimeString("ru-RU") : ""
          });
        });
      });
    });
    if (rows.length === 0) {
      showToast("История остановок пока пуста — экспортировать нечего.", true);
      return;
    }
    // Most recent first
    rows.reverse();
    var ws = XLSX.utils.json_to_sheet(rows);
    ws["!cols"] = [
      { wch: 28 }, { wch: 30 }, { wch: 26 }, { wch: 12 },
      { wch: 10 }, { wch: 40 }, { wch: 22 }, { wch: 18 }
    ];
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "История остановок");
    var stamp = new Date().toISOString().slice(0,10);
    XLSX.writeFile(wb, "история_остановок_работ_" + stamp + ".xlsx");
  }

  // Полная еженедельная выгрузка: сотрудники+СИЗ, история остановок,
  // дефектные акты — всё в одном Excel-файле с несколькими листами.
  function exportFullReportToExcel(){
    if (!window.XLSX) {
      showToast("Библиотека экспорта не загрузилась. Проверьте интернет-соединение.", true);
      return;
    }

    var wb = XLSX.utils.book_new();

    // Лист 1: Сотрудники и СИЗ (одна строка на каждую позицию СИЗ у сотрудника)
    var sizRows = [];
    data.departments.forEach(function(dept){
      dept.employees.forEach(function(emp){
        SIZ_CATALOG.forEach(function(cat){
          var rec = emp.equipment[cat.id];
          var testDate = rec && rec.testDate ? rec.testDate : null;
          var st = statusForDate(testDate, cat.months);
          sizRows.push({
            "ФИО": emp.name,
            "Подразделение": dept.name,
            "Должность": emp.position || "",
            "Табельный №": emp.tabNumber || "",
            "Вид СИЗ": cat.name,
            "Периодичность, мес.": cat.months,
            "Дата испытания": testDate ? fmtDate(testDate) : "",
            "Следующая проверка": st.next ? fmtDate(st.next) : "",
            "Статус": st.label,
            "Есть фото": (rec && rec.photos && rec.photos.length > 0) ? "Да" : "Нет",
            "Приостановлен": (emp.workStop && emp.workStop.active) ? "Да" : "Нет"
          });
        });
      });
    });
    var wsSiz = XLSX.utils.json_to_sheet(sizRows);
    wsSiz["!cols"] = [
      { wch: 28 }, { wch: 30 }, { wch: 26 }, { wch: 12 }, { wch: 26 },
      { wch: 14 }, { wch: 14 }, { wch: 16 }, { wch: 14 }, { wch: 10 }, { wch: 12 }
    ];
    XLSX.utils.book_append_sheet(wb, wsSiz, "Сотрудники и СИЗ");

    // Лист 2: История остановок работ (все записи, не только активные)
    var stopRows = [];
    data.departments.forEach(function(dept){
      dept.employees.forEach(function(emp){
        (emp.stopHistory || []).forEach(function(rec){
          stopRows.push({
            "ФИО": emp.name,
            "Подразделение": dept.name,
            "Статус": rec.active ? "Активно" : "Снято",
            "Причина остановки": rec.reason || "",
            "Кто остановил": rec.stoppedBy || "",
            "Дата остановки": rec.dateStarted ? fmtDate(rec.dateStarted.slice(0,10)) + " " + new Date(rec.dateStarted).toLocaleTimeString("ru-RU") : "",
            "Кто снял": rec.liftedBy || "",
            "Дата снятия": rec.dateLifted ? fmtDate(rec.dateLifted.slice(0,10)) + " " + new Date(rec.dateLifted).toLocaleTimeString("ru-RU") : ""
          });
        });
      });
    });
    var wsStop = XLSX.utils.json_to_sheet(stopRows);
    wsStop["!cols"] = [
      { wch: 28 }, { wch: 30 }, { wch: 10 }, { wch: 40 },
      { wch: 22 }, { wch: 18 }, { wch: 22 }, { wch: 18 }
    ];
    XLSX.utils.book_append_sheet(wb, wsStop, "История остановок");

    // Лист 3: Дефектные акты
    var acts = (data.defectActs || []).slice().sort(function(a,b){ return new Date(b.date) - new Date(a.date); });
    var actRows = acts.map(function(r){
      var d = new Date(r.date);
      return {
        "Дата": isNaN(d.getTime()) ? r.date : d.toLocaleString("ru-RU"),
        "ФИО сотрудника": r.empName,
        "Подразделение": r.deptName,
        "Должность": r.empPosition || "",
        "Табельный №": r.empTabNumber || "",
        "СИЗ / инструмент": r.toolName,
        "Причина": r.reason,
        "Фото приложено": r.photoDataUrl ? "Да" : "Нет"
      };
    });
    var wsActs = XLSX.utils.json_to_sheet(actRows);
    wsActs["!cols"] = [
      { wch: 18 }, { wch: 28 }, { wch: 30 }, { wch: 24 },
      { wch: 12 }, { wch: 24 }, { wch: 40 }, { wch: 12 }
    ];
    XLSX.utils.book_append_sheet(wb, wsActs, "Дефектные акты");

    var stamp = new Date().toISOString().slice(0,10);
    XLSX.writeFile(wb, "СИЗ_полная_выгрузка_" + stamp + ".xlsx");
    showToast("Полная выгрузка скачана.", false);
  }

  function computeStopList(){
    var list = [];
    data.departments.forEach(function(dept){
      dept.employees.forEach(function(emp){
        if (emp.workStop && emp.workStop.active) {
          list.push({ dept: dept, emp: emp });
        }
      });
    });
    return list;
  }

  function renderStopCountPanel(root){
    var stopList = computeStopList();
    var panel = document.createElement("div");
    panel.className = "stop-count-panel" + (stopList.length === 0 ? " zero" : "");
    var icon = document.createElement("div");
    icon.className = "stop-icon-img";
    panel.appendChild(icon);
    var textWrap = document.createElement("div");
    textWrap.style.width = "100%";
    if (stopList.length === 0) {
      textWrap.innerHTML = '<div class="stop-count-text">Приостановленных работ нет</div>';
      panel.appendChild(textWrap);
    } else {
      var titleEl = document.createElement("div");
      titleEl.className = "stop-count-text";
      titleEl.textContent = "Приостановлено работ: " + stopList.length;
      textWrap.appendChild(titleEl);
      var namesWrap = document.createElement("div");
      namesWrap.className = "stop-count-names";
      stopList.forEach(function(x, idx){
        var nameBtn = document.createElement("button");
        nameBtn.className = "stop-name-link";
        nameBtn.textContent = x.emp.name;
        nameBtn.addEventListener("click", function(){
          check.step = 2;
          check.empDeptId = x.dept.id;
          check.empId = x.emp.id;
          renderCheck();
        });
        namesWrap.appendChild(nameBtn);
        if (idx < stopList.length - 1) namesWrap.appendChild(document.createTextNode(", "));
      });
      textWrap.appendChild(namesWrap);
      panel.appendChild(textWrap);

  // Same idea as the "stopped work" banner above, but for defect acts:
  // green/quiet when nothing is pending, orange and expandable when there
  // are acts waiting to be reviewed. Clicking jumps straight to the
  // "Деф. акты" tab.
  function renderDefectCountPanel(root){
    var acts = data.defectActs || [];
    var panel = document.createElement("div");
    panel.className = "defect-count-panel" + (acts.length === 0 ? " zero" : "");
    var icon = document.createElement("div");
    icon.className = "defect-count-icon";
    icon.textContent = acts.length === 0 ? "✅" : "🛠";
    panel.appendChild(icon);

    var textWrap = document.createElement("div");
    textWrap.style.width = "100%";
    if (acts.length === 0) {
      textWrap.innerHTML = '<div class="defect-count-text">Дефектных актов нет</div>';
    } else {
      var titleEl = document.createElement("div");
      titleEl.className = "defect-count-text";
      titleEl.textContent = "Дефектных актов: " + acts.length;
      textWrap.appendChild(titleEl);

      var namesWrap = document.createElement("div");
      namesWrap.className = "defect-count-names";
      var recent = acts.slice().sort(function(a,b){ return new Date(b.date) - new Date(a.date); }).slice(0, 5);
      recent.forEach(function(rec, idx){
        var nameBtn = document.createElement("button");
        nameBtn.className = "defect-count-link";
        nameBtn.textContent = rec.empName + " (" + rec.toolName + ")";
        nameBtn.addEventListener("click", function(e){
          e.stopPropagation();
          document.querySelector('.tab[data-tab="defects"]').click();
        });
        namesWrap.appendChild(nameBtn);
        if (idx < recent.length - 1) namesWrap.appendChild(document.createTextNode(", "));
      });
      if (acts.length > recent.length) {
        namesWrap.appendChild(document.createTextNode(" и ещё " + (acts.length - recent.length) + "…"));
      }
      textWrap.appendChild(namesWrap);
    }
    panel.appendChild(textWrap);

    panel.addEventListener("click", function(){
      document.querySelector('.tab[data-tab="defects"]').click();
    });

    root.appendChild(panel);
  }

  function statusIconSvg(code){
    var strokeMap = { ok:"var(--ok)", warn:"var(--warn)", danger:"var(--danger)", none:"var(--none)" };
    var stroke = strokeMap[code] || "var(--ink-soft)";
    return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">'+
      '<path d="M12 2 4 5v6c0 5 3.5 8.5 8 10 4.5-1.5 8-5 8-10V5l-8-3z" stroke="'+stroke+'" stroke-width="2" stroke-linejoin="round"/>'+
      '</svg>';
  }

  function renderStatsDashboard(root){
    var statsData = computeOverallStatsDetailed();
    var counts = statsData.counts;
    var details = statsData.details;
    var total = counts.ok + counts.warn + counts.danger + counts.none;
    if (total === 0) return;

    var panel = document.createElement("div");
    panel.className = "panel";
    panel.innerHTML = '<h2 style="font-size:18px;margin-bottom:14px;display:flex;align-items:center;gap:8px;">'+
      '<svg width="22" height="22" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">'+
        '<path d="M6 30c0-9.9 8.1-18 18-18s18 8.1 18 18" stroke="var(--accent)" stroke-width="3.2" stroke-linecap="round"/>'+
        '<rect x="4" y="29" width="40" height="5.5" rx="1" fill="var(--accent)"/>'+
      '</svg>'+
      'Общая картина по срокам СИЗ</h2>';

    var rowsDef = [
      { code:"ok",     label:"Действителен",    color:"var(--ok)" },
      { code:"warn",   label:"Истекает скоро",  color:"var(--warn)" },
      { code:"danger", label:"Просрочено",      color:"var(--danger)" },
      { code:"none",   label:"Нет данных",      color:"var(--none)" }
    ];
    var barsWrap = document.createElement("div");
    barsWrap.className = "stats-bars";
    rowsDef.forEach(function(r){
      var count = counts[r.code] || 0;
      var pct = total ? Math.round(count / total * 100) : 0;
      var rowEl = document.createElement("div");
      rowEl.className = "stats-row";
      rowEl.style.cursor = "pointer";
      rowEl.title = "Нажмите, чтобы посмотреть список";
      rowEl.innerHTML =
        '<div class="stats-label">'+statusIconSvg(r.code)+'<span>'+r.label+'</span></div>'+
        '<div class="stats-bar-track"><div class="stats-bar-fill" style="width:'+pct+'%;background:'+r.color+';"></div></div>'+
        '<div class="stats-count">'+count+' <span class="stats-pct">('+pct+'%)</span></div>';
      rowEl.addEventListener("click", function(){
        openStatusDrilldown(r.code, r.label, details[r.code] || []);
      });
      barsWrap.appendChild(rowEl);
    });
    panel.appendChild(barsWrap);

    var hint = document.createElement("div");
    hint.className = "hint";
    hint.style.marginTop = "10px";
    hint.textContent = "Всего позиций СИЗ по всем сотрудникам: " + total + ". Нажмите на строку выше, чтобы увидеть список и выгрузить его в Excel.";
    panel.appendChild(hint);

    root.appendChild(panel);
  }

  // Minimal, no-chrome view shown when someone scans an employee's own
  // personal QR code: just the SIZ expiry list and the stop/start-work
  // control — no tabs, no PIN, no admin/editor UI, nothing else.

    var dept = getDept(check.empDeptId);
    var emp = dept ? getEmp(dept, check.empId) : null;
    if (!dept || !emp) {
      root.innerHTML = '<div class="empty">Сотрудник не найден.</div>';

    // this employee's own defect acts (no other tabs exist on this minimal

        '</div>'+
        '<div class="siz-card-meta">'+
          'Периодичность: <b>'+cat.months+' мес.</b><br>'+

        var who = prompt("ФИО приостанавливающего работы:");

    defectBox.className = "stop-work-box";
    var defectBtn = document.createElement("button");

    defectBtn.style.padding = "14px";
    defectBtn.style.fontSize = "15px";
    defectBtn.textContent = "🛠 Оформить дефектный акт (инструмент/СИЗ не пригоден к дальнейшему использованию)";
    defectBtn.addEventListener("click", function(){ openDefectActWizard(dept, emp); });
    defectBox.appendChild(defectBtn);
    panel.appendChild(defectBox);

    root.appendChild(panel);
  }

  function renderCheck(){
    var root = document.getElementById("view-check");
    root.innerHTML = "";
    if (!data) { root.innerHTML = '<div class="loading">Загрузка…</div>'; return; }

    if (personalMode) { renderPersonalMinimal(root); return; }

    maybeRenderErrorBanner(root);
    renderSteps(root);
    if (check.step === 1) renderStopCountPanel(root);
    if (check.step === 1) renderDefectCountPanel(root);
    if (check.step === 1) renderStatsDashboard(root);
    if (check.step === 1) {
      var midBand = document.createElement("div");
      midBand.className = "mid-photo-band";
      midBand.innerHTML = '<div class="mid-photo-caption">Безопасность начинается со средств защиты</div>';
      root.appendChild(midBand);
    }
    var panel = document.createElement("div");
    panel.className = "panel";
    root.appendChild(panel);

    if (check.step === 1) {
      panel.innerHTML = '<h2 style="font-size:20px;margin-bottom:14px;">Найдите сотрудника</h2>';

      if (check.deptFilter && getDept(check.deptFilter)) {
        var fdept = getDept(check.deptFilter);
        var chip = document.createElement("div");
        chip.className = "filter-chip";
        chip.innerHTML = '<span>Подразделение: '+escapeHtml(fdept.name)+'</span>';
        var clearBtn = document.createElement("button");
        clearBtn.textContent = "×";
        clearBtn.title = "Показать всех";
        clearBtn.addEventListener("click", function(){ check.deptFilter = null; renderCheck(); });
        chip.appendChild(clearBtn);
        panel.appendChild(chip);
      }

      var searchWrap = document.createElement("div");
      searchWrap.className = "field";
      searchWrap.innerHTML = '<input type="text" id="emp-search" placeholder="Введите фамилию сотрудника…" style="width:100%;" autofocus>';
      panel.appendChild(searchWrap);

      var stopPolicyHint = document.createElement("div");
      stopPolicyHint.className = "hint";
      stopPolicyHint.style.marginTop = "-6px";
      stopPolicyHint.style.marginBottom = "10px";
      stopPolicyHint.textContent = "Здесь можно только посмотреть сроки СИЗ. Остановить работы можно лишь по личному QR-коду сотрудника или через панель управления — так исключается намеренная остановка чужой работы.";
      panel.appendChild(stopPolicyHint);

      var resultsWrap = document.createElement("div");
      panel.appendChild(resultsWrap);

      var totalCount = check.deptFilter ? (getDept(check.deptFilter) ? getDept(check.deptFilter).employees.length : 0) : allEmployeesFlat().length;
      if (totalCount === 0) {
        resultsWrap.innerHTML = '<div class="empty">Сотрудники пока не добавлены. Откройте вкладку «Управление».</div>';
        return;
      }

      function drawList(filter){
        resultsWrap.innerHTML = "";
        var pool = check.deptFilter && getDept(check.deptFilter)
          ? getDept(check.deptFilter).employees.map(function(e){ return { dept: getDept(check.deptFilter), emp: e }; })
          : allEmployeesFlat();

        var f = filter.trim().toLowerCase();
        var list = pool;
        if (f) {
          list = pool.filter(function(p){ return p.emp.name.toLowerCase().indexOf(f) !== -1; });
        } else if (!check.deptFilter) {
          resultsWrap.innerHTML = '<div class="hint">Начните вводить фамилию, чтобы найти сотрудника (всего в базе '+totalCount+' '+pluralPeople(totalCount)+').</div>';
          return;
        }

        if (list.length === 0) {
          resultsWrap.innerHTML = '<div class="empty">Никого не найдено.</div>';
          return;
        }
        var MAX = 40;
        var shown = list.slice(0, MAX);
        var grid = document.createElement("div");
        grid.className = "grid-buttons";
        shown.forEach(function(p){
          var b = document.createElement("button");
          b.className = "pick-btn";
          var sub = p.dept.name + (p.emp.position ? " · " + p.emp.position : "");
          b.innerHTML = escapeHtml(p.emp.name) + '<span class="sub">'+escapeHtml(sub)+'</span>';
          b.addEventListener("click", function(){
            check.step = 2; check.empDeptId = p.dept.id; check.empId = p.emp.id;
            renderCheck();
          });
          grid.appendChild(b);
        });
        resultsWrap.appendChild(grid);
        if (list.length > MAX) {
          var more = document.createElement("div");
          more.className = "hint";
          more.style.marginTop = "10px";
          more.textContent = "Показаны первые "+MAX+" из "+list.length+" — уточните запрос.";
          resultsWrap.appendChild(more);
        }
      }

      drawList("");
      searchWrap.querySelector("#emp-search").addEventListener("input", function(e){
        drawList(e.target.value);
      });
    }

    if (check.step === 2) {
      var dept = getDept(check.empDeptId);
      var emp = dept ? getEmp(dept, check.empId) : null;
      if (!dept || !emp) { check.step = 1; return renderCheck(); }
      var back = document.createElement("button");
      back.className = "backlink";
      back.innerHTML = "← Найти другого сотрудника";
      back.addEventListener("click", function(){ check.step = 1; renderCheck(); });
      panel.appendChild(back);

      var card = document.createElement("div");
      card.className = "person-card";
      card.innerHTML = '<div class="person-name">'+escapeHtml(emp.name)+'</div>'+
        '<div class="person-meta">'+
          '<span>'+escapeHtml(dept.name)+'</span>'+
          (emp.position ? '<span>'+escapeHtml(emp.position)+'</span>' : '') +
          (emp.tabNumber ? '<span>Таб. № '+escapeHtml(String(emp.tabNumber))+'</span>' : '') +
        '</div>';
      panel.appendChild(card);

      if (emp.workStop && emp.workStop.active) {
        var stopBanner = document.createElement("div");
        stopBanner.className = "stop-banner";
        var stopIcon = document.createElement("div");
        stopIcon.className = "stop-icon-img";
        stopBanner.appendChild(stopIcon);
        var stopText = document.createElement("div");
        stopText.innerHTML =
          '<div class="stop-banner-title">ДОСТУП К РАБОТАМ ЗАПРЕЩЁН</div>'+
          '<div class="stop-banner-name">'+escapeHtml(emp.name)+'</div>';
        stopBanner.appendChild(stopText);
        panel.appendChild(stopBanner);
      }

      var list = document.createElement("div");
      list.className = "siz-card-list";
      SIZ_CATALOG.forEach(function(cat){
        var rec = emp.equipment[cat.id];
        var testDate = rec && rec.testDate ? rec.testDate : null;
        var st = statusForDate(testDate, cat.months);
        var cardEl = document.createElement("div");
        cardEl.className = "siz-card " + st.code;
        cardEl.innerHTML =
          '<div class="siz-card-top">'+
            '<div class="siz-card-name">'+escapeHtml(cat.name)+'</div>'+
            '<div class="siz-card-status '+st.code+'">'+st.label+'</div>'+
          '</div>'+
          '<div class="siz-card-meta">'+
            'Периодичность: <b>'+cat.months+' мес.</b><br>'+
            'Дата испытания: <b>'+(testDate ? fmtDate(testDate) : '—')+'</b><br>'+
            'Следующая проверка: <b>'+(st.next ? fmtDate(st.next) : '—')+'</b>'+
          '</div>';
        if (rec && rec.photos && rec.photos.length > 0) {
          var photoRow = document.createElement("div");
          photoRow.className = "siz-card-photos";
          rec.photos.forEach(function(p, pIdx){
            var thumbBtn = document.createElement("button");
            thumbBtn.type = "button";
            thumbBtn.className = "photo-thumb-btn";
            thumbBtn.innerHTML = '<img src="'+p.dataUrl+'" class="photo-thumb-img">';
            thumbBtn.title = p.note || "Открыть фото";
            thumbBtn.addEventListener("click", function(){ openPhotoLightbox(rec.photos, pIdx); });
            photoRow.appendChild(thumbBtn);
          });
          cardEl.appendChild(photoRow);
        }
        list.appendChild(cardEl);
      });
      panel.appendChild(list);

      if (emp.workStop && emp.workStop.active) {
        var stopDesc = document.createElement("div");
        stopDesc.className = "stop-desc";
        var sd = new Date(emp.workStop.date);
        var stopDateStr = isNaN(sd.getTime()) ? emp.workStop.date : sd.toLocaleString("ru-RU");
        stopDesc.innerHTML =
          '<div class="stop-desc-title">Причина остановки работ</div>'+
          '<div class="stop-desc-reason">'+escapeHtml(emp.workStop.reason)+'</div>'+
          '<div class="stop-desc-meta">Остановил: <b>'+escapeHtml(emp.workStop.stoppedBy || "не указано")+'</b> · '+escapeHtml(stopDateStr)+'</div>';
        panel.appendChild(stopDesc);
      } else {
        // Anti-abuse guard: stopping someone's work is only allowed when
        // reached via THAT employee's own confidential personal QR link, or
        // by an unlocked admin/PIN session. This prevents a coworker from
        // opening the general (public) employee list and stopping a
        // different person's work out of spite.
        var canStop = adminUnlocked || (check.viaPersonalLink && check.personalToken && check.personalToken === emp.accessToken);
        if (canStop) {
          var stopActionBox = document.createElement("div");
          stopActionBox.className = "stop-work-box";
          var stopActionBtn = document.createElement("button");
          stopActionBtn.className = "btn danger";
          stopActionBtn.style.width = "100%";
          stopActionBtn.style.padding = "16px";
          stopActionBtn.style.fontSize = "16px";
          stopActionBtn.textContent = "⛔ СТОП — приостановить все виды работ";
          stopActionBtn.addEventListener("click", async function(){
            var who = prompt("ФИО приостанавливающего работы:");
            if (!who || !who.trim()) { showToast("Пожалуйста, укажите ФИО приостанавливающего работы.", true); return; }
            var reason = prompt("Причина остановки работ (нарушение СИЗ, опасные условия труда и т.д.):");
            if (!reason || !reason.trim()) return;
            await mutateAndSave(function(){
              startWorkStop(emp, reason.trim(), who.trim());
            });
            renderCheck();
          });
          stopActionBox.appendChild(stopActionBtn);
          panel.appendChild(stopActionBox);
        } else {
          var lockedBox = document.createElement("div");
          lockedBox.className = "stop-work-box";
          lockedBox.innerHTML =
            '<div class="hint" style="padding:14px;border:2px dashed var(--line);">'+
            '🔒 Остановка работ для этого сотрудника доступна только по его личному QR-коду '+
            'или через панель управления (PIN). Это сделано специально, чтобы никто не мог '+
            'открыть общий список и остановить работу другого человека.'+
            '</div>';
          panel.appendChild(lockedBox);
        }
      }
    }
  }

  function pluralPeople(n){
    var m = n % 100;
    if (m >= 11 && m <= 14) return "сотрудников";
    var l = n % 10;
    if (l === 1) return "сотрудник";
    if (l >= 2 && l <= 4) return "сотрудника";
    return "сотрудников";
  }

  function escapeHtml(s){
    var d = document.createElement("div");
    d.textContent = (s === undefined || s === null) ? "" : s;
    return d.innerHTML;
  }

  // ---------- ADMIN LOCK ----------
  function renderAdmin(){
    var root = document.getElementById("view-admin");
    root.innerHTML = "";
    if (!data || adminPin === null) { root.innerHTML = '<div class="loading">Загрузка…</div>'; return; }

    if (!adminUnlocked) {
      var lock = document.createElement("div");
      lock.className = "lock-screen panel";
      lock.innerHTML =
        '<h2 style="font-size:18px;margin-bottom:6px;">Режим управления</h2>'+
        '<p class="hint" style="margin-bottom:14px;">Введите PIN-код, чтобы добавлять и удалять сотрудников и сроки СИЗ.</p>'+
        '<input type="password" id="pin-input" placeholder="PIN" inputmode="numeric">'+
        '<div class="lock-error" id="pin-error"></div>';
      var unlockBtn = document.createElement("button");
      unlockBtn.className = "btn accent";
      unlockBtn.textContent = "Войти";
      unlockBtn.addEventListener("click", tryUnlock);
      lock.appendChild(unlockBtn);
      root.appendChild(lock);
      var pinInput = lock.querySelector("#pin-input");
      pinInput.addEventListener("keydown", function(e){ if (e.key === "Enter") tryUnlock(); });
      pinInput.focus();
      return;
    }

    renderAdminContent(root);
  }

  function tryUnlock(){
    var val = document.getElementById("pin-input").value.trim();
    if (val === MASTER_PIN) {
      adminUnlocked = true;
      isDeveloperSession = true;
      renderAdmin();
    } else if (val === adminPin) {
      adminUnlocked = true;
      isDeveloperSession = false;
      renderAdmin();
    } else {
      document.getElementById("pin-error").textContent = "Неверный PIN-код";
    }
  }

  // ---------- ADMIN CONTENT ----------
  function worstStatusForEmp(emp){
    var order = { danger:3, warn:2, none:1, ok:0 };
    var worst = "ok";
    SIZ_CATALOG.forEach(function(cat){
      var rec = emp.equipment[cat.id];
      var testDate = rec && rec.testDate ? rec.testDate : null;
      var st = statusForDate(testDate, cat.months);
      if (order[st.code] > order[worst]) worst = st.code;
    });
    return worst;
  }

  function renderAdminContent(root){
    maybeRenderErrorBanner(root);
    var topRow = document.createElement("div");
    topRow.className = "panel";
    topRow.style.display = "flex";
    topRow.style.justifyContent = "space-between";
    topRow.style.alignItems = "center";
    topRow.style.flexWrap = "wrap";
    topRow.style.gap = "12px";
    topRow.innerHTML = '<div><h2 style="font-size:18px;">Управление сотрудниками и сроками СИЗ</h2><p class="hint">Изменения видны всем, кто открывает эту ссылку.</p></div>';
    var rightBtns = document.createElement("div");
    rightBtns.style.display = "flex";
    rightBtns.style.gap = "8px";
    var changePinBtn = document.createElement("button");
    changePinBtn.className = "btn ghost small";
    changePinBtn.textContent = "Сменить PIN";
    changePinBtn.addEventListener("click", async function(){
      var np = prompt("Новый PIN-код (только для этой вкладки):");
      if (np && np.trim()) {
        var who = prompt("Ваше имя (записывается в историю изменений):");
        var ok = await savePin(np.trim());
        if (ok) {
          showToast("PIN обновлён.", false);
          appendPinLog(who ? who.trim() : "");
        }
        else showToast("Не удалось сохранить новый PIN. Проверьте соединение.", true);
      }
    });
    var lockBtn = document.createElement("button");
    lockBtn.className = "btn ghost small";
    lockBtn.textContent = "Выйти";
    lockBtn.addEventListener("click", function(){
      adminUnlocked = false;
      isDeveloperSession = false;
      pinLogVisible = false;
      renderAdmin();
    });
    var exportBtn = document.createElement("button");
    exportBtn.className = "btn ghost small";
    exportBtn.textContent = "Скачать историю нарушений (Excel)";
    exportBtn.addEventListener("click", exportStopHistoryToExcel);
    rightBtns.appendChild(exportBtn);

    var fullExportBtn = document.createElement("button");
    fullExportBtn.className = "btn accent small";
    fullExportBtn.textContent = "⬇ Полная выгрузка (Excel)";
    fullExportBtn.title = "Скачать всё сразу одним Excel-файлом: сотрудники и СИЗ, история остановок, дефектные акты — удобно сохранять раз в неделю";
    fullExportBtn.addEventListener("click", exportFullReportToExcel);
    rightBtns.appendChild(fullExportBtn);

    // ---- Ручная резервная копия всей базы (JSON-файл на компьютер) ----
    var backupBtn = document.createElement("button");
    backupBtn.className = "btn ghost small";
    backupBtn.textContent = "⬇ Резервная копия базы";
    backupBtn.title = "Скачать всю базу (сотрудники, СИЗ, дефектные акты) одним файлом";
    backupBtn.addEventListener("click", function(){
      try {
        var json = JSON.stringify(data, null, 2);
        var blob = new Blob([json], { type: "application/json" });
        var url = URL.createObjectURL(blob);
        var link = document.createElement("a");
        link.href = url;
        var stamp = new Date().toISOString().slice(0,10);
        link.download = "siz_backup_" + stamp + ".json";
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        setTimeout(function(){ URL.revokeObjectURL(url); }, 5000);
        showToast("Резервная копия скачана.", false);
      } catch(e){
        showToast("Не удалось создать резервную копию.", true);
      }
    });
    rightBtns.appendChild(backupBtn);

    if (isDeveloperSession) {
      var restoreBtn = document.createElement("button");
      restoreBtn.className = "btn ghost small";
      restoreBtn.textContent = "⬆ Загрузить резервную копию";
      restoreBtn.title = "Полностью заменить текущую базу файлом резервной копии";
      var restoreFileInput = document.createElement("input");
      restoreFileInput.type = "file";
      restoreFileInput.accept = "application/json,.json";
      restoreFileInput.style.display = "none";
      restoreBtn.addEventListener("click", function(){ restoreFileInput.click(); });
      restoreFileInput.addEventListener("change", async function(){
        var file = restoreFileInput.files && restoreFileInput.files[0];
        restoreFileInput.value = "";
        if (!file) return;
        if (!confirm("Это ПОЛНОСТЬЮ заменит текущую базу содержимым выбранного файла. Текущие данные будут потеряны, если их не сохранить отдельно. Продолжить?")) return;
        try {
          var text = await file.text();
          var parsed = JSON.parse(text);
          if (!parsed || !Array.isArray(parsed.departments)) {
            showToast("Файл не похож на резервную копию этой базы.", true);
            return;
          }
          var ok = await mutateAndSave(function(){
            data = ensureSizCatalog(migrateEquipment(parsed));
            ensureAccessTokens(data);
          });
          if (ok) { showToast("База восстановлена из резервной копии.", false); renderAdmin(); }
        } catch(e){
          showToast("Не удалось прочитать файл резервной копии.", true);
        }
      });
      rightBtns.appendChild(restoreBtn);
      rightBtns.appendChild(restoreFileInput);
    }

    rightBtns.appendChild(changePinBtn);
    if (isDeveloperSession) {
      var clearAllHistBtn = document.createElement("button");
      clearAllHistBtn.className = "btn ghost small";
      clearAllHistBtn.textContent = "Очистить всю историю нарушений";
      clearAllHistBtn.addEventListener("click", async function(){
        if (!confirm("Удалить ВСЮ историю приостановок по всем сотрудникам? Это действие необратимо.")) return;
        await mutateAndSave(function(){
          data.departments.forEach(function(d){
            d.employees.forEach(function(e){ e.stopHistory = []; });
          });
        });
        renderAdmin();
      });
      rightBtns.appendChild(clearAllHistBtn);

      var clearAllDatesGlobalBtn = document.createElement("button");
      clearAllDatesGlobalBtn.className = "btn danger small";
      clearAllDatesGlobalBtn.textContent = "Очистить ВСЕ даты СИЗ (все сотрудники)";
      clearAllDatesGlobalBtn.title = "Убрать даты испытания по всем видам СИЗ у абсолютно всех сотрудников во всех подразделениях. Фото не удаляются.";
      clearAllDatesGlobalBtn.addEventListener("click", async function(){
        var totalEmp = 0;
        data.departments.forEach(function(d){ totalEmp += d.employees.length; });
        if (!confirm("Очистить даты испытания ПО ВСЕМ ВИДАМ СИЗ у ВСЕХ сотрудников ("+totalEmp+" чел.) во всех подразделениях?\n\nЭто действие необратимо. Фото останутся, будут очищены только даты.")) return;
        var typed = prompt('Чтобы подтвердить, введите слово "ОЧИСТИТЬ" (заглавными буквами):');
        if (typed !== "ОЧИСТИТЬ") { showToast("Отменено — подтверждение не совпало.", true); return; }
        await mutateAndSave(function(){
          data.departments.forEach(function(d){
            d.employees.forEach(function(e){
              SIZ_CATALOG.forEach(function(cat){
                if (e.equipment[cat.id]) {
                  delete e.equipment[cat.id].testDate;
                  if (!e.equipment[cat.id].photos || e.equipment[cat.id].photos.length === 0) {
                    delete e.equipment[cat.id];
                  }
                }
              });
            });
          });
        });
        renderAdmin();
      });
      rightBtns.appendChild(clearAllDatesGlobalBtn);
    }
    if (isDeveloperSession) {
      var pinLogBtn = document.createElement("button");
      pinLogBtn.className = "btn ghost small";
      pinLogBtn.textContent = pinLogVisible ? "Скрыть журнал PIN" : "Журнал смены PIN";
      pinLogBtn.addEventListener("click", async function(){
        if (!pinLogVisible) {
          pinLogEntries = await loadPinLog();
          pinLogVisible = true;
        } else {
          pinLogVisible = false;
        }
        renderAdmin();
      });
      rightBtns.appendChild(pinLogBtn);
    }
    rightBtns.appendChild(lockBtn);
    topRow.appendChild(rightBtns);
    root.appendChild(topRow);

    if (isDeveloperSession && pinLogVisible) {
      var logPanel = document.createElement("div");
      logPanel.className = "panel";
      var logHtml = '<h3 style="font-size:15px;margin-bottom:10px;">Журнал смены PIN (видно только разработчику)</h3>';
      if (pinLogEntries.length === 0) {
        logHtml += '<div class="empty">Пока никто не менял PIN через это устройство.</div>';
      } else {
        logHtml += '<div style="display:flex;flex-direction:column;gap:6px;">';
        pinLogEntries.slice().reverse().forEach(function(entry){
          var d = new Date(entry.date);
          var dateStr = isNaN(d.getTime()) ? entry.date : d.toLocaleString("ru-RU");
          logHtml += '<div style="font-size:13.5px;border-bottom:1px solid var(--line);padding-bottom:6px;">'+
            '<b>'+escapeHtml(dateStr)+'</b> — '+escapeHtml(entry.who || "не указано")+
            '</div>';
        });
        logHtml += '</div>';
      }
      logPanel.innerHTML = logHtml;
      root.appendChild(logPanel);
    }

    if (isDeveloperSession) {
      // Quick cross-department view of everyone who currently has an active
      // work stop, so the developer can selectively lift stops without
      // hunting through each department section individually.
      var stoppedPanel = document.createElement("div");
      stoppedPanel.className = "panel";
      var stoppedList = [];
      data.departments.forEach(function(d){
        d.employees.forEach(function(e){
          if (e.workStop && e.workStop.active) stoppedList.push({ dept: d, emp: e });
        });
      });
      stoppedPanel.innerHTML = '<h3 style="font-size:15px;margin-bottom:10px;">⛔ Работники с активным запретом на работы ('+stoppedList.length+')</h3>';

      if (stoppedList.length === 0) {
        var noneEl = document.createElement("div");
        noneEl.className = "empty";
        noneEl.textContent = "Сейчас ни у кого не остановлены работы.";
        stoppedPanel.appendChild(noneEl);
      } else {
        var stoppedListWrap = document.createElement("div");
        stoppedListWrap.style.display = "flex";
        stoppedListWrap.style.flexDirection = "column";
        stoppedListWrap.style.gap = "10px";

        stoppedList.forEach(function(p){
          var sDept = p.dept, sEmp = p.emp;
          var row = document.createElement("div");
          row.className = "stop-work-box active";
          row.style.display = "flex";
          row.style.justifyContent = "space-between";
          row.style.alignItems = "flex-start";
          row.style.gap = "12px";
          row.style.flexWrap = "wrap";

          var icon = document.createElement("div");
          icon.className = "stop-icon-img";
          row.appendChild(icon);

          var info = document.createElement("div");
          info.style.flex = "1";
          info.style.minWidth = "200px";
          var wd = new Date(sEmp.workStop.date);
          var wdStr = isNaN(wd.getTime()) ? sEmp.workStop.date : wd.toLocaleString("ru-RU");
          info.innerHTML =
            '<div class="stop-work-title">'+escapeHtml(sEmp.name)+'</div>'+
            '<div class="hint" style="margin:2px 0 4px;">'+escapeHtml(sDept.name)+(sEmp.position ? ' · '+escapeHtml(sEmp.position) : '')+'</div>'+
            '<div class="stop-work-reason">'+escapeHtml(sEmp.workStop.reason)+'</div>'+
            '<div class="stop-work-meta">Остановил: <b>'+escapeHtml(sEmp.workStop.stoppedBy || "не указано")+'</b> · '+escapeHtml(wdStr)+'</div>';

                arr.push({ id: uid(), dataUrl: dataUrl, note: note, addedAt: new Date().toISOString() });
              }
            });
          });
          bulk.selected = {};
          bulk.photoPreviewDataUrl = null;
          bulk.photoDriveUrl = null;
          bulk.photoNote = "";
          renderAdmin();
        });
        bulkPhotoRow.appendChild(applyBulkPhotoBtn);
        bulkPhotoBox.appendChild(bulkPhotoRow);

        body.appendChild(bulkPhotoBox);
      }

      if (finalEmployees.length === 0) {
        var noEmp = document.createElement("div");
        noEmp.className = "empty";

      finalEmployees.forEach(function(emp){

            '<div class="stop-work-meta">Остановил: <b>'+escapeHtml(emp.workStop.stoppedBy || "не указано")+'</b> · '+escapeHtml(wdStr)+'</div>';

            liftBtn.className = "btn ghost small";
            liftBtn.textContent = "Снять запрет";

            clearHistBtn.style.marginTop = "10px";
            clearHistBtn.textContent = "Очистить историю нарушений";

          empBlock.appendChild(histBox);
        }

        body.appendChild(empBlock);
      });

      item.appendChild(body);
      root.appendChild(item);
