  // ---------- Personal (confidential) employee QR ----------
  // Opens a printable overlay with a single QR code that deep-links directly
  // to this one employee's own card (#p=<accessToken>). Unlike the general
  // QR codes (which open a searchable list of everyone), this link is meant
  // to be handed only to that employee or their direct supervisor, so no one
  // else can browse the full list and stop someone else's work on purpose.
  function openPersonalQrCard(dept, emp){
    var existing = document.getElementById("personal-qr-overlay");
    if (existing) existing.remove();

    var overlay = document.createElement("div");
    overlay.id = "personal-qr-overlay";
    overlay.className = "no-print";
    overlay.style.cssText = "position:fixed;inset:0;background:rgba(12,42,61,0.55);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;";

    var box = document.createElement("div");
    box.id = "personal-print-area";
    box.style.cssText = "background:#fff;border:3px solid var(--line-strong);padding:24px;max-width:380px;width:100%;text-align:center;position:relative;";

    var closeBtn = document.createElement("button");
    closeBtn.className = "btn no-print";
    closeBtn.textContent = "Закрыть";
    closeBtn.style.cssText = "position:absolute;top:10px;right:10px;padding:6px 12px;font-size:12px;";
    closeBtn.addEventListener("click", function(){ overlay.remove(); });
    box.appendChild(closeBtn);

    var title = document.createElement("h3");
    title.style.cssText = "font-size:16px;margin:6px 0 8px;padding-right:70px;text-align:left;";
    title.textContent = "Личный QR-код сотрудника";
    box.appendChild(title);

    var warn = document.createElement("p");
    warn.className = "hint";
    warn.style.cssText = "color:var(--danger);font-weight:600;text-align:left;margin-bottom:14px;";
    warn.textContent = "Конфиденциально: передайте лично сотруднику или его непосредственному руководителю. Не размещайте на общем стенде вместе с остальными.";
    box.appendChild(warn);

    var qrDiv = document.createElement("div");
    qrDiv.className = "qr-box";
    qrDiv.style.margin = "0 auto 14px";
    box.appendChild(qrDiv);

    var nameEl = document.createElement("div");
    nameEl.style.marginBottom = "4px";
    nameEl.innerHTML = "<strong>"+escapeHtml(emp.name)+"</strong>";
    box.appendChild(nameEl);

    if (emp.position || emp.tabNumber) {
      var metaEl = document.createElement("div");
      metaEl.className = "hint";
      var bits = [];
      if (emp.position) bits.push(escapeHtml(emp.position));
      if (emp.tabNumber) bits.push("Таб. № " + escapeHtml(String(emp.tabNumber)));
      metaEl.textContent = bits.join(" · ");
      box.appendChild(metaEl);
    }

    var printBtn = document.createElement("button");
    printBtn.className = "btn accent no-print";
    printBtn.textContent = "Печать";
    printBtn.style.marginTop = "14px";
    printBtn.addEventListener("click", function(){ window.print(); });
    box.appendChild(printBtn);

    overlay.appendChild(box);
    overlay.addEventListener("click", function(e){ if (e.target === overlay) overlay.remove(); });
    document.body.appendChild(overlay);

    var baseUrl = window.location.href.split("#")[0];
    new QRCode(qrDiv, { text: baseUrl + "#p=" + emp.accessToken, width: 180, height: 180, colorDark:"#14181C", colorLight:"#ffffff" });
  }

  // ---------- Personal QR tab (one code per employee, same size as the
  // uniform "Актюбинский ДЭСД" cards) ----------
  function renderPersonalQrPage(){
    var root = document.getElementById("view-personalqr");
    root.innerHTML = "";
    if (!data || adminPin === null) { root.innerHTML = '<div class="loading">Загрузка…</div>'; return; }

    if (!adminUnlocked) {
      var lock = document.createElement("div");
      lock.className = "lock-screen panel";
      lock.innerHTML =
        '<h2 style="font-size:18px;margin-bottom:6px;">Личные QR-коды</h2>'+
        '<p class="hint" style="margin-bottom:14px;">Раздел конфиденциальный — введите PIN-код, чтобы распечатать личные QR-коды сотрудников.</p>'+
        '<input type="password" id="pinp-input" placeholder="PIN" inputmode="numeric">'+
        '<div class="lock-error" id="pinp-error"></div>';
      var unlockBtn = document.createElement("button");
      unlockBtn.className = "btn accent";
      unlockBtn.textContent = "Войти";
      unlockBtn.addEventListener("click", tryUnlockPersonalQr);
      lock.appendChild(unlockBtn);
      root.appendChild(lock);
      var pinInput = lock.querySelector("#pinp-input");
      pinInput.addEventListener("keydown", function(e){ if (e.key === "Enter") tryUnlockPersonalQr(); });
      pinInput.focus();
      return;
    }

    renderPersonalQrContent(root);
  }

  function tryUnlockPersonalQr(){
    var val = document.getElementById("pinp-input").value.trim();
    if (val === MASTER_PIN) {
      adminUnlocked = true; isDeveloperSession = true; renderPersonalQrPage();
    } else if (val === adminPin) {
      adminUnlocked = true; isDeveloperSession = false; renderPersonalQrPage();
    } else {
      document.getElementById("pinp-error").textContent = "Неверный PIN-код";
    }
  }

  // ---------- Defect acts tab ----------
  function renderDefectActsPage(){
    var root = document.getElementById("view-defects");
    root.innerHTML = "";
    if (!data) { root.innerHTML = '<div class="loading">Загрузка…</div>'; return; }
    renderDefectActsContent(root);
  }

  function exportDefectActsToExcel(acts){
    if (!window.XLSX) {
      showToast("Библиотека экспорта не загрузилась. Проверьте интернет-соединение.", true);
      return;
    }
    if (acts.length === 0) {
      showToast("Список пуст — экспортировать нечего.", true);
      return;
    }
    var rows = acts.map(function(r){
      var d = new Date(r.date);
      return {
        "Дата": isNaN(d.getTime()) ? r.date : d.toLocaleString("ru-RU"),
        "ФИО сотрудника": r.empName,
        "Подразделение": r.deptName,
        "Должность": r.empPosition || "",
        "Табельный №": r.empTabNumber || "",
        "СИЗ / инструмент": r.toolName,
        "Причина": r.reason,
        "Фото приложено": r.photoDataUrl ? "Да" : "Нет"
      };
    });
    var ws = XLSX.utils.json_to_sheet(rows);
    ws["!cols"] = [
      { wch: 18 }, { wch: 28 }, { wch: 30 }, { wch: 24 },
      { wch: 12 }, { wch: 24 }, { wch: 40 }, { wch: 12 }
    ];
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Деф. акты");
    var stamp = new Date().toISOString().slice(0,10);
    XLSX.writeFile(wb, "дефектные_акты_" + stamp + ".xlsx");
  }

  function renderDefectActsContent(root){
    var wrap = document.createElement("div");

    var acts = (data.defectActs || []).slice().sort(function(a,b){
      return new Date(b.date) - new Date(a.date);
    });

    var topPanel = document.createElement("div");
    topPanel.className = "panel";
    topPanel.style.display = "flex";
    topPanel.style.justifyContent = "space-between";
    topPanel.style.alignItems = "center";
    topPanel.style.flexWrap = "wrap";
    topPanel.style.gap = "12px";
    topPanel.innerHTML = '<div><h2 style="font-size:18px;">Дефектные акты ('+acts.length+')</h2>'+
      '<p class="hint">Акты, которые сотрудники оформили сами через свой личный QR-код при поломке СИЗ или инструмента.</p></div>';
    var exportAllBtn = document.createElement("button");
    exportAllBtn.className = "btn ghost small";
    exportAllBtn.textContent = "⬇ Список в Excel";
    exportAllBtn.addEventListener("click", function(){ exportDefectActsToExcel(acts); });
    topPanel.appendChild(exportAllBtn);
    wrap.appendChild(topPanel);

    if (acts.length === 0) {
      var emptyPanel = document.createElement("div");
      emptyPanel.className = "panel";
      emptyPanel.innerHTML = '<div class="empty">Пока никто не оформлял дефектных актов.</div>';
      wrap.appendChild(emptyPanel);
    } else {
      acts.forEach(function(rec){
        var card = document.createElement("div");
        card.className = "panel";
        var d = new Date(rec.date);
        var dateStr = isNaN(d.getTime()) ? rec.date : d.toLocaleString("ru-RU");

        var headRow = document.createElement("div");
        headRow.style.cssText = "display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:8px;";
        var headInfo = document.createElement("div");
        headInfo.innerHTML =
          '<div style="font-weight:700;font-size:14.5px;">'+escapeHtml(rec.toolName)+'</div>'+
          '<div class="hint" style="margin-top:2px;">'+escapeHtml(rec.empName)+' · '+escapeHtml(rec.deptName)+(rec.empPosition ? ' · '+escapeHtml(rec.empPosition) : '')+'</div>'+
          '<div class="hint">'+escapeHtml(dateStr)+'</div>';
        headRow.appendChild(headInfo);

        var btnGroup = document.createElement("div");
        btnGroup.style.cssText = "display:flex;gap:6px;flex-wrap:wrap;flex-shrink:0;";
        var dlBtn = document.createElement("button");
        dlBtn.className = "btn small";
        dlBtn.textContent = "⬇ Word";
        dlBtn.title = "Скачать акт в формате Word";
        dlBtn.addEventListener("click", function(){ generateDefectActWord(rec); });
        btnGroup.appendChild(dlBtn);
        if (isDeveloperSession) {
          var delActBtn = document.createElement("button");
          delActBtn.className = "btn danger small";
          delActBtn.textContent = "Удалить";
          delActBtn.addEventListener("click", async function(){
            if (!confirm("Удалить этот дефектный акт?")) return;
            await mutateAndSave(function(){
              data.defectActs = (data.defectActs || []).filter(function(x){ return x.id !== rec.id; });
            });
            renderDefectActsPage();
          });
          btnGroup.appendChild(delActBtn);
        }
        headRow.appendChild(btnGroup);
        card.appendChild(headRow);

        var reasonEl = document.createElement("div");
        reasonEl.style.fontSize = "13.5px";
        reasonEl.style.marginBottom = rec.photoDataUrl ? "10px" : "0";
        reasonEl.innerHTML = "<b>Причина:</b> " + escapeHtml(rec.reason);
        card.appendChild(reasonEl);

        if (rec.photoDataUrl) {
          var thumbBtn = document.createElement("button");
          thumbBtn.type = "button";
          thumbBtn.className = "photo-thumb-btn";
          thumbBtn.style.width = "80px";
          thumbBtn.style.height = "80px";
          thumbBtn.innerHTML = '<img src="'+rec.photoDataUrl+'" class="photo-thumb-img">';
          thumbBtn.addEventListener("click", function(){
            openPhotoLightbox([{ id: rec.id, dataUrl: rec.photoDataUrl, note: rec.toolName, addedAt: rec.date }], 0);
          });
          card.appendChild(thumbBtn);
        }

        wrap.appendChild(card);
      });
    }

    root.appendChild(wrap);
  }

  function renderPersonalQrContent(root){
    var wrap = document.createElement("div");
    wrap.className = "qr-page";

    var topHint = document.createElement("div");
    topHint.className = "no-print";
    topHint.innerHTML = '<p class="hint">Личный QR-код на каждого сотрудника — того же размера, что и карточки «Актюбинский ДЭСД», только вместо общей ссылки внутри зашита ссылка на конкретного человека, а под кодом напечатано его ФИО. Распечатайте столько листов, сколько нужно, и разрежьте по пунктирной линии. Раздавайте лично в руки — не вывешивайте на общий стенд.</p>';
    var pBtn = document.createElement("button");
    pBtn.className = "btn accent";
    pBtn.textContent = "Печать";
    pBtn.style.marginTop = "8px";
    pBtn.addEventListener("click", function(){ window.print(); });
    topHint.appendChild(pBtn);
    wrap.appendChild(topHint);

    var printArea = document.createElement("div");
    printArea.id = "print-area";

    var heading = document.createElement("h3");
    heading.style.cssText = "font-size:16px;margin:8px 0;";

    printArea.appendChild(heading);

    var all = allEmployeesFlat();
    var subHint = document.createElement("p");
    subHint.className = "hint";
    subHint.style.marginBottom = "10px";
    subHint.textContent = "Карточки 65×38 мм — как в едином QR-коде выше. Всего карточек: " + all.length + ".";
    printArea.appendChild(subHint);

    var grid = document.createElement("div");
    grid.className = "qr-list-uniform";

      name.className = "name";
      name.textContent = p.emp.name;
      card.appendChild(name);

  // ---------- QR ----------
  function renderQr(){
    var root = document.getElementById("view-qr");
    root.innerHTML = "";
    if (!data) { root.innerHTML = '<div class="loading">Загрузка…</div>'; return; }

    var wrap = document.createElement("div");
    wrap.className = "qr-page";

    var printBtn = document.createElement("div");
    printBtn.className = "no-print";
    printBtn.innerHTML = '<p class="hint">Распечатайте QR-код и разместите его на стенде или в подразделении. При сканировании телефон откроет страницу поиска сотрудника.</p>';
    var pBtn = document.createElement("button");
    pBtn.className = "btn accent";
    pBtn.textContent = "Печать";
    pBtn.style.marginTop = "8px";
    pBtn.addEventListener("click", function(){ window.print(); });
    printBtn.appendChild(pBtn);
    wrap.appendChild(printBtn);

    var printArea = document.createElement("div");
    printArea.id = "print-area";

    var mainBox = document.createElement("div");
    mainBox.className = "qr-main";
    var qrDiv = document.createElement("div");
    qrDiv.className = "qr-box";
    mainBox.appendChild(qrDiv);
    var textDiv = document.createElement("div");
    textDiv.innerHTML = '<h2 style="font-size:20px;margin-bottom:8px;">Проверка сроков СИЗ</h2><p class="hint">Отсканируйте QR-код, найдите себя по фамилии и посмотрите сроки испытаний СИЗ.</p>';
    mainBox.appendChild(textDiv);

    var issueDate = fmtDate(new Date());
    var footer = document.createElement("div");
    footer.className = "qr-footer";
    footer.style.width = "100%";
    footer.innerHTML =
      '<div class="qr-footer-field"><label>Дата выдачи QR-кода</label><span class="value">'+issueDate+'</span></div>'+
      '<div class="qr-footer-field"><label>Ответственный (Ф.И.О., подпись)</label><span class="value">&nbsp;</span></div>';
    var stamp = document.createElement("div");
    stamp.className = "stamp-box";
    stamp.textContent = "М.П.";
    footer.appendChild(stamp);
    mainBox.appendChild(footer);

    printArea.appendChild(mainBox);

    var baseUrl = window.location.href.split("#")[0];
    new QRCode(qrDiv, { text: baseUrl, width: 160, height: 160, colorDark:"#14181C", colorLight:"#ffffff" });

    if (data.departments.length > 0) {
      var h = document.createElement("h3");
      h.style.fontSize = "16px";
      h.style.margin = "8px 0";
      h.textContent = "Отдельные QR-коды по подразделениям (сужают поиск до подразделения)";
      var cutHint = document.createElement("p");
      cutHint.className = "hint";
      cutHint.style.marginBottom = "10px";
      cutHint.textContent = "Каждая карточка размером под служебное удостоверение (80×50 мм) — обрежьте по пунктирной линии.";
      printArea.appendChild(h);
      printArea.appendChild(cutHint);
      var list = document.createElement("div");
      list.className = "qr-list";
      data.departments.forEach(function(dept){
        var card = document.createElement("div");
        card.className = "qr-card";
        var qb = document.createElement("div");
        qb.className = "qr-box";
        card.appendChild(qb);
        var name = document.createElement("div");
        name.className = "name";
        name.textContent = dept.name;
        card.appendChild(name);

        var cardFooter = document.createElement("div");
        cardFooter.className = "qr-footer";
        cardFooter.innerHTML =
          '<div class="qr-footer-field"><label>Дата выдачи</label><span class="value">'+issueDate+'</span></div>';
        var cardStamp = document.createElement("div");
        cardStamp.className = "stamp-box";
        cardStamp.textContent = "М.П.";
        cardFooter.appendChild(cardStamp);
        card.appendChild(cardFooter);

        list.appendChild(card);
        new QRCode(qb, { text: baseUrl + "#dept=" + dept.id, width: 100, height: 100, colorDark:"#14181C", colorLight:"#ffffff" });
      });
      printArea.appendChild(list);
    }

    var uniformHeading = document.createElement("h3");
    uniformHeading.style.fontSize = "16px";
    uniformHeading.style.margin = "20px 0 8px";
    uniformHeading.textContent = "Единый QR-код для всех подразделений (печать на весь лист)";
    printArea.appendChild(uniformHeading);

    var uniformHint = document.createElement("p");
    uniformHint.className = "hint";
    uniformHint.style.marginBottom = "10px";
    uniformHint.textContent = "Одинаковые компактные карточки под служебное удостоверение (65×38 мм) с запасом от края — распечатайте нужное количество листов и разрежьте по пунктирной линии.";
    printArea.appendChild(uniformHint);

    var uniformGrid = document.createElement("div");
    uniformGrid.className = "qr-list-uniform";
    var UNIFORM_COPIES = 40;
    for (var ui = 0; ui < UNIFORM_COPIES; ui++) {
      var uCard = document.createElement("div");
      uCard.className = "qr-card-mini";
      var uBox = document.createElement("div");
      uBox.className = "qr-box";
      uCard.appendChild(uBox);
      var uName = document.createElement("div");
      uName.className = "name";
      uName.textContent = "Актюбинский ДЭСД";
      uCard.appendChild(uName);
      uniformGrid.appendChild(uCard);
      new QRCode(uBox, { text: baseUrl, width: 70, height: 70, colorDark:"#14181C", colorLight:"#ffffff" });
    }
    printArea.appendChild(uniformGrid);

    wrap.appendChild(printArea);
    root.appendChild(wrap);
  }

  // ---------- Deep link on load ----------
  function applyHash(){
    var h = window.location.hash;
    if (h.indexOf("#dept=") === 0) {
      var id = h.replace("#dept=", "");
      if (getDept(id)) {
        check.deptFilter = id;
      }
    } else if (h.indexOf("#p=") === 0) {
      // Personal, confidential deep link — jumps straight to one employee's
      // own card without exposing the searchable full employee list.
      var token = decodeURIComponent(h.replace("#p=", ""));
      var found = findByToken(token);
      if (found) {
        check.step = 2;
        check.empDeptId = found.dept.id;
        check.empId = found.emp.id;
        check.viaPersonalLink = true;
        check.personalToken = token;
        personalMode = true;
      }
    }
  }

  // ---------- Init ----------
  (async function init(){
    document.getElementById("view-check").innerHTML = '<div class="loading">Загрузка…</div>';
    await loadData();
    await loadPin();
    applyHash();
    if (personalMode) {
      // Confidential personal-QR mode: hide the header/tabs entirely so the
      // page shows nothing but SIZ status and the stop control — no PIN,
      // no admin/editor UI, no navigation to other sections.
      var topbarEl = document.querySelector(".topbar");
      if (topbarEl) topbarEl.style.display = "none";
      var tabsEl = document.querySelector(".tabs");
      if (tabsEl) tabsEl.style.display = "none";
    }
    renderCheck();
  })();

})();
</script>
